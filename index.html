<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت بیمارستان‌ها</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --text:#172033;
    --muted:#697386;
    --border:#e5e7eb;

    --ready:#16a34a;
    --no-answer:#dc2626;
    --catalog:#2563eb;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
a{
    font-family:inherit;
}

header{
    background:var(--card);
    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1100px;
    margin:auto;

    min-height:70px;
    padding:12px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:var(--primary);
}

.header-title{
    font-size:15px;
    color:var(--muted);
}

main{
    max-width:1100px;
    margin:auto;
    padding:25px 18px 50px;
}

.page-title{
    margin-bottom:7px;
    font-size:25px;
    font-weight:bold;
}

.page-description{
    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;
}


/* =========================================
   SEARCH
========================================= */

.search-box{
    position:relative;
    margin-bottom:20px;
}

.search-input{
    width:100%;

    border:1px solid var(--border);
    background:#fff;

    border-radius:14px;

    padding:14px 48px 14px 45px;

    font-family:inherit;
    font-size:14px;

    color:var(--text);

    outline:none;

    transition:.2s;
}

.search-input:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
}

.search-input::placeholder{
    color:#9ca3af;
}

.search-icon{
    position:absolute;

    right:16px;
    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    pointer-events:none;
}

.clear-search{
    position:absolute;

    left:10px;
    top:50%;

    transform:translateY(-50%);

    width:30px;
    height:30px;

    border:none;
    border-radius:50%;

    background:#f1f5f9;

    color:var(--muted);

    cursor:pointer;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:19px;
}

.clear-search.show{
    display:flex;
}

.search-result-count{
    margin-top:-8px;
    margin-bottom:14px;

    font-size:12px;
    color:var(--muted);
}

.search-hint{
    margin-top:-8px;
    margin-bottom:17px;

    font-size:12px;
    color:var(--muted);
}


/* =========================================
   PROVINCES
========================================= */

.province-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.province-card{
    border:1px solid var(--border);

    background:var(--card);

    border-radius:16px;

    padding:20px;

    cursor:pointer;

    transition:.2s;

    min-height:90px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.province-card:hover{
    border-color:var(--primary);

    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.06);
}

.province-name{
    font-size:17px;
    font-weight:bold;
}

.province-count{
    font-size:12px;

    color:var(--muted);

    margin-top:7px;
}

.arrow{
    width:34px;
    height:34px;

    border-radius:50%;

    background:#eff6ff;

    color:var(--primary);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}


/* =========================================
   BACK
========================================= */

.back-button{
    border:none;

    background:transparent;

    color:var(--primary);

    font-size:15px;

    cursor:pointer;

    margin-bottom:20px;

    padding:5px 0;
}


/* =========================================
   HOSPITALS
========================================= */

.hospital-list{
    display:flex;
    flex-direction:column;

    gap:12px;
}

.hospital-card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:16px;

    padding:18px;

    cursor:pointer;

    transition:.2s;
}

.hospital-card:hover{
    border-color:var(--primary);

    box-shadow:
        0 7px 22px rgba(0,0,0,.06);
}

.hospital-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.hospital-name{
    font-size:16px;

    font-weight:bold;

    line-height:1.8;
}

.hospital-city{
    color:var(--muted);

    font-size:13px;

    margin-top:5px;
}


/* =========================================
   STATUS
========================================= */

.status{
    white-space:nowrap;

    padding:7px 11px;

    border-radius:30px;

    font-size:12px;

    font-weight:bold;
}

.status-ready{
    background:#dcfce7;
    color:var(--ready);
}

.status-no-answer{
    background:#fee2e2;
    color:var(--no-answer);
}

.status-catalog{
    background:#dbeafe;
    color:var(--catalog);
}


/* =========================================
   MODAL
========================================= */

.modal{
    position:fixed;

    inset:0;

    background:
        rgba(15,23,42,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;

    z-index:1000;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;

    max-width:550px;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:22px;

    padding:23px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.2);
}

.modal-header{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;
}

.modal-title{
    font-size:20px;

    font-weight:bold;

    line-height:1.8;
}

.close-button{
    width:36px;
    height:36px;

    border:none;

    border-radius:50%;

    background:#f1f5f9;

    cursor:pointer;

    font-size:20px;

    flex-shrink:0;
}

.section-title{
    font-size:14px;

    font-weight:bold;

    margin-bottom:10px;
}

.phone-list{
    display:flex;

    flex-direction:column;

    gap:9px;

    margin-bottom:25px;
}

.phone-button{
    text-decoration:none;

    background:#eff6ff;

    border:1px solid #dbeafe;

    color:var(--primary);

    border-radius:12px;

    padding:13px 15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    direction:ltr;

    font-size:15px;

    font-weight:bold;

    transition:.2s;
}

.phone-button:hover{
    background:#dbeafe;
}

.phone-icon{
    direction:rtl;
}


/* =========================================
   STATUS BUTTONS
========================================= */

.status-buttons{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;
}

.status-button{
    border:2px solid transparent;

    border-radius:12px;

    padding:13px 8px;

    cursor:pointer;

    font-weight:bold;

    font-size:12px;

    transition:.2s;
}

.status-button.ready{
    background:#dcfce7;
    color:var(--ready);
}

.status-button.no-answer{
    background:#fee2e2;
    color:var(--no-answer);
}

.status-button.catalog{
    background:#dbeafe;
    color:var(--catalog);
}

.status-button.selected{
    border-color:currentColor;

    transform:scale(.97);
}


/* =========================================
   EMPTY
========================================= */

.empty{
    background:white;

    border:1px solid var(--border);

    border-radius:16px;

    padding:30px;

    text-align:center;

    color:var(--muted);

    line-height:2;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .header-inner{
        min-height:60px;
    }

    .header-title{
        display:none;
    }

    main{
        padding:20px 14px 40px;
    }

    .page-title{
        font-size:22px;
    }

    .province-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .province-card{
        padding:15px;

        min-height:80px;

        border-radius:14px;
    }

    .province-name{
        font-size:15px;
    }

    .arrow{
        width:29px;
        height:29px;

        font-size:15px;
    }

    .hospital-card{
        padding:15px;
    }

    .hospital-top{
        align-items:flex-start;
    }

    .hospital-name{
        font-size:14px;
    }

    .status{
        font-size:10px;
        padding:6px 8px;
    }

    .status-buttons{
        grid-template-columns:1fr;
    }

    .status-button{
        padding:14px;
    }

    .modal{
        align-items:flex-end;

        padding:0;
    }

    .modal-box{
        max-width:none;

        max-height:92vh;

        border-radius:
            22px 22px 0 0;

        padding:20px;
    }

    .search-input{
        font-size:14px;
    }
}

@media(max-width:380px){

    .province-grid{
        grid-template-columns:1fr;
    }
}

</style>

</head>

/* =========================================
   STATUS
========================================= */

const statusNames = {

    "ready":"آماده تماس",

    "no-answer":"تماس بی‌پاسخ",

    "catalog":"ارسال کاتالوگ"

};


let selectedHospital = null;

let currentProvince = null;


/* =========================================
   NORMALIZE PERSIAN TEXT
========================================= */

function normalizeText(text){

    return String(text || "")

        .toLowerCase()

        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ة/g,"ه")
        .replace(/ۀ/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ|أ|ٱ/g,"ا")

        .replace(/‌/g," ")

        .replace(/\s+/g," ")

        .trim();
}


/* =========================================
   GET STATUS SEARCH TEXT
========================================= */

function getStatusSearchText(status){

    if(status === "ready"){

        return `
            آماده تماس
            اماده تماس
            آماده
            اماده
        `;

    }


    if(status === "no-answer"){

        return `
            تماس بی پاسخ
            تماس بیپاسخ
            بی پاسخ
            بیپاسخ
            تماس
        `;

    }


    if(status === "catalog"){

        return `
            ارسال کاتالوگ
            کاتالوگ
        `;

    }


    return `
        وضعیت ثبت نشده
    `;
}


/* =========================================
   HOSPITAL SEARCH
========================================= */

function matchesHospitalSearch(hospital,query){

    const normalizedQuery =
        normalizeText(query);


    if(!normalizedQuery){

        return true;

    }


    const status =
        getHospitalStatus(hospital.id);


    const statusText =
        statusNames[status] || "وضعیت ثبت نشده";


    const searchableText =
        normalizeText(
            hospital.name +
            " " +
            hospital.city +
            " " +
            statusText +
            " " +
            getStatusSearchText(status)
        );


    const words =
        normalizedQuery
            .split(" ")
            .filter(Boolean);


    return words.every(word => {

        return searchableText.includes(word);

    });

}

/* =========================================
   RENDER HOSPITALS
========================================= */

function renderHospitals(province){

    const list =
        document.getElementById(
            "hospitalList"
        );


    const searchInput =
        document.getElementById(
            "hospitalSearch"
        );


    const countBox =
        document.getElementById(
            "hospitalSearchCount"
        );


    const provinceHospitals =
        hospitals[province] || [];


    const query =
        normalizeText(
            searchInput.value
        );


    list.innerHTML = "";


    const filtered =
        provinceHospitals.filter(
            hospital =>
                matchesHospitalSearch(
                    hospital,
                    query
                )
        );


    if(query){

        countBox.textContent =
            `نمایش ${filtered.length} از ${provinceHospitals.length} بیمارستان`;

    }else{

        countBox.textContent =
            `${provinceHospitals.length} بیمارستان`;

    }


    if(filtered.length === 0){

        list.innerHTML = `

            <div class="empty">

                موردی با این جستجو پیدا نشد.

                <br>

                نام بیمارستان، شهر یا وضعیت تماس را امتحان کنید.

            </div>

        `;

        return;

    }


    filtered.forEach(hospital => {

        const card =
            document.createElement("div");


        card.className =
            "hospital-card";


        const currentStatus =
            getHospitalStatus(
                hospital.id
            );


        card.onclick =
            () => openHospital(hospital);


        card.innerHTML = `

            <div class="hospital-top">

                <div>

                    <div class="hospital-name">

                        ${hospital.name}

                    </div>


                    <div class="hospital-city">

                        ${hospital.city}

                    </div>

                </div>


                <div
                    class="status ${getStatusClass(currentStatus)}">

                    ${
                        statusNames[currentStatus]
                        || "وضعیت ثبت نشده"
                    }

                </div>

            </div>

        `;


        list.appendChild(card);

    });

}

/* =========================================

========================================= */

function openHospital(hospital){

    selectedHospital =
        hospital;


    document
        .getElementById(
            "modalHospitalName"
        )
        .textContent =
            hospital.name;


    document
        .getElementById(
            "modalHospitalCity"
        )
        .textContent =
            hospital.city;


    const phones =
        document.getElementById(
            "modalPhones"
        );


    phones.innerHTML = "";


    hospital.phones.forEach(phone => {

        const button =
            document.createElement("a");


        button.className =
            "phone-button";


        button.href =
            "tel:" + phone;


        button.innerHTML = `

            <span>
                ${phone}
            </span>

            <span class="phone-icon">
                📞 تماس
            </span>

        `;


        phones.appendChild(button);

    });


    updateStatusButtons();


    document
        .getElementById("hospitalModal")
        .classList.add("active");

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

    document
        .getElementById("hospitalModal")
        .classList.remove("active");


    selectedHospital = null;

}


/* =========================================
   SET STATUS
========================================= */

function setHospitalStatus(status){

    if(!selectedHospital){

        return;

    }


    const key =
        "hospital_status_" +
        selectedHospital.id;


    localStorage.setItem(
        key,
        status
    );


    updateStatusButtons();


    closeModal();


    /*
       لیست همان جستجوی فعلی را
       حفظ می‌کند.
    */

    if(currentProvince){

        renderHospitals(
            currentProvince
        );

    }

}


/* =========================================
   GET STATUS
========================================= */

function getHospitalStatus(id){

    return localStorage.getItem(
        "hospital_status_" + id
    );

}


/* =========================================
   STATUS CLASS
========================================= */

function getStatusClass(status){

    if(status === "ready"){

        return "status-ready";

    }


    if(status === "no-answer"){

        return "status-no-answer";

    }


    if(status === "catalog"){

        return "status-catalog";

    }


    return "";

}


/* =========================================
   UPDATE STATUS BUTTONS
========================================= */

function updateStatusButtons(){

    if(!selectedHospital){

        return;

    }


    const current =
        getHospitalStatus(
            selectedHospital.id
        );


    document
        .getElementById("statusReady")
        .classList.toggle(
            "selected",
            current === "ready"
        );


    document
        .getElementById("statusNoAnswer")
        .classList.toggle(
            "selected",
            current === "no-answer"
        );


    document
        .getElementById("statusCatalog")
        .classList.toggle(
            "selected",
            current === "catalog"
        );

}


/* =========================================
   FIND PROVINCE
========================================= */

function findProvinceByHospital(id){

    for(
        const province of Object.keys(hospitals)
    ){

        const found =
            hospitals[province]
                .find(
                    hospital =>
                        hospital.id === id
                );


        if(found){

            return province;

        }

    }


    return null;

}


/* =========================================
   CLEAR BUTTON
========================================= */

function updateClearButton(
    input,
    button
){

    if(input.value.trim()){

        button.classList.add("show");

    }else{

        button.classList.remove("show");

    }

}
