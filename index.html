<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت بیمارستان‌ها</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f4f8fc;
    --bg2:#ffffff;

    --card:#ffffff;
    --card2:#f8fbff;

    --blue:#1677ff;
    --blue2:#3b8cff;
    --blue-dark:#0d5dcc;
    --blue-soft:#eaf3ff;

    --text:#172033;
    --muted:#718096;

    --green:#16a66a;
    --green-soft:#eafaf3;

    --orange:#ed9418;
    --orange-soft:#fff6e7;

    --red:#e5484d;
    --red-soft:#fff0f1;

    --border:#e3ebf5;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(22,119,255,.13),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f6f9fd 48%,
            #f1f6fb 100%
        );
    color:var(--text);
    min-height:100vh;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:50;

    background:rgba(255,255,255,.88);
    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(220,230,242,.85);

    padding:15px;

    box-shadow:
        0 5px 25px rgba(31,71,120,.06);
}

.header-inner{
    max-width:1100px;
    margin:auto;
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:900;
    color:#172033;
    margin-bottom:14px;
}

.logo span{
    color:var(--blue);
}


/* =========================================================
   TOP BUTTONS
========================================================= */

.top-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
}

.top-btn{
    border:1px solid #0d6ff0;

    background:
        linear-gradient(
            135deg,
            #1680ff,
            #1267e8
        );

    color:#fff;

    border-radius:12px;

    padding:10px 16px;

    font-size:13px;
    font-weight:bold;

    box-shadow:
        0 6px 16px rgba(22,119,255,.20);

    transition:
        transform .2s,
        box-shadow .2s,
        background .2s;
}

.top-btn:hover{
    background:
        linear-gradient(
            135deg,
            #278aff,
            #0d61dd
        );

    transform:translateY(-1px);

    box-shadow:
        0 9px 22px rgba(22,119,255,.25);
}

.top-btn:active{
    transform:translateY(0);
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:24px 14px 55px;
}

.page-title{
    font-size:23px;
    font-weight:900;
    color:#172033;
    margin-bottom:16px;
}

.page-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:-8px;
    margin-bottom:18px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    position:relative;
    margin-bottom:18px;
}

.search-box input{
    width:100%;
    height:52px;

    background:#ffffff;

    border:1px solid #dce7f3;

    border-radius:15px;

    outline:none;

    color:#172033;

    padding:
        0 46px 0 44px;

    font-size:14px;

    box-shadow:
        0 5px 20px rgba(35,75,120,.055);

    transition:
        border-color .2s,
        box-shadow .2s;
}

.search-box input::placeholder{
    color:#9aa8b8;
}

.search-box input:focus{
    border-color:#78afff;

    box-shadow:
        0 0 0 4px rgba(22,119,255,.09),
        0 7px 24px rgba(35,75,120,.07);
}

.search-icon{
    position:absolute;
    right:15px;
    top:15px;

    color:#7d8da1;

    font-size:17px;

    pointer-events:none;
}

.clear-search{
    position:absolute;
    left:10px;
    top:10px;

    width:32px;
    height:32px;

    border:1px solid #dce7f3;

    border-radius:10px;

    background:#f5f8fc;

    color:#7d8da1;

    display:none;

    transition:.2s;
}

.clear-search:hover{
    background:#eaf3ff;
    color:var(--blue);
    border-color:#b9d5fb;
}

.clear-search.show{
    display:block;
}


/* =========================================================
   PROVINCE GRID
========================================================= */

.province-grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );
    gap:13px;
}

.province-card{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #fafdff
        );

    border:1px solid #e1eaf4;

    border-radius:18px;

    padding:18px;

    min-height:110px;

    transition:
        transform .2s,
        box-shadow .2s,
        border-color .2s;

    box-shadow:
        0 8px 28px rgba(35,75,120,.075);

    overflow:hidden;
}

.province-card::before{
    content:"";

    position:absolute;

    top:0;
    right:0;
    left:0;

    height:3px;

    background:
        linear-gradient(
            90deg,
            #126be8,
            #5ba3ff
        );

    opacity:.9;
}

.province-card:hover{
    transform:translateY(-3px);

    border-color:#bcd7f8;

    box-shadow:
        0 13px 32px rgba(35,75,120,.12);
}

.province-name{
    font-size:17px;
    font-weight:900;

    color:#172033;

    margin-bottom:10px;
}

.province-count{
    color:#718096;
    font-size:12px;
}

.province-status{
    display:flex;
    gap:5px;
    margin-top:12px;
    flex-wrap:wrap;
}

.mini-status{
    font-size:10px;

    padding:4px 7px;

    border-radius:7px;

    background:#f2f6fa;

    color:#6e7e91;

    border:1px solid #e5edf5;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn{
    border:1px solid #cfe0f4;

    background:#ffffff;

    color:#176bd8;

    padding:9px 14px;

    border-radius:11px;

    margin-bottom:15px;

    font-size:12px;
    font-weight:bold;

    box-shadow:
        0 4px 14px rgba(35,75,120,.06);

    transition:.2s;
}

.back-btn:hover{
    background:#edf5ff;

    border-color:#a9caf2;

    transform:translateY(-1px);
}


/* =========================================================
   HOSPITAL GRID
========================================================= */

.hospital-grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px,1fr)
        );

    gap:14px;
}


/* =========================================================
   HOSPITAL CARD
========================================================= */

.hospital-card{
    position:relative;

    background:#ffffff;

    border:1px solid #e1eaf4;

    border-radius:18px;

    padding:17px;

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;

    box-shadow:
        0 8px 26px rgba(35,75,120,.065);
}

.hospital-card:hover{
    transform:translateY(-2px);

    border-color:#bcd7f8;

    box-shadow:
        0 13px 32px rgba(35,75,120,.11);
}

.hospital-title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    gap:10px;

    margin-bottom:7px;
}

.hospital-name{
    font-weight:900;

    line-height:1.7;

    font-size:15px;

    color:#172033;

    flex:1;
}

.delete-btn{
    flex:0 0 auto;

    width:35px;
    height:35px;

    border-radius:10px;

    border:1px solid #f0c8ca;

    background:#fff6f6;

    color:#e5484d;

    font-size:16px;

    transition:.2s;
}

.delete-btn:hover{
    background:#ffe9ea;

    border-color:#eba7aa;

    color:#d83238;

    transform:scale(1.04);
}

.hospital-city{
    color:#8090a3;

    font-size:12px;

    margin-bottom:12px;
}


/* =========================================================
   STATUS BADGES
========================================================= */

.status-badge{
    display:inline-flex;

    padding:6px 10px;

    border-radius:9px;

    font-size:11px;

    font-weight:bold;

    margin-bottom:12px;

    border:1px solid transparent;
}

.status-ready{
    color:#128257;

    background:
        var(--green-soft);

    border-color:#c9efdf;
}

.status-no-answer{
    color:#d13c42;

    background:
        var(--red-soft);

    border-color:#f7d1d3;
}

.status-catalog{
    color:#c27a08;

    background:
        var(--orange-soft);

    border-color:#f5dfb8;
}

.status-follow-up{
    color:#146dd4;

    background:
        var(--blue-soft);

    border-color:#c9def9;
}


/* =========================================================
   PHONE BUTTONS
========================================================= */

.card-phone{
    width:100%;

    border:1px solid #dce7f3;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #f8fbfe
        );

    color:#176bd8;

    border-radius:11px;

    padding:10px;

    margin-top:7px;

    text-align:center;

    font-size:13px;

    font-weight:bold;

    display:block;

    text-decoration:none;

    transition:
        background .2s,
        border-color .2s,
        transform .2s,
        box-shadow .2s;
}

.card-phone:hover{
    border-color:#9fc5f3;

    background:#edf6ff;

    color:#075fca;

    transform:translateY(-1px);

    box-shadow:
        0 5px 15px rgba(22,119,255,.08);
}


/* =========================================================
   NOTE
========================================================= */

.note{
    margin-top:11px;

    padding:10px;

    border-radius:11px;

    background:#f7f9fc;

    border:1px solid #e7edf4;

    color:#68788c;

    font-size:11px;

    line-height:1.8;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    background:
        rgba(22,42,70,.32);

    backdrop-filter:blur(8px);

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(520px,100%);

    max-height:90vh;

    overflow:auto;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f9fcff
        );

    border:1px solid #dce7f3;

    border-radius:22px;

    padding:20px;

    box-shadow:
        0 30px 80px rgba(31,65,105,.22);
}

.modal-header{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:10px;

    margin-bottom:16px;
}

.modal-title{
    font-size:18px;

    font-weight:900;

    line-height:1.7;

    color:#172033;
}

.modal-city{
    color:#7c8da1;

    font-size:12px;

    margin-top:4px;
}

.close-btn{
    width:36px;
    height:36px;

    border:1px solid #dce7f3;

    border-radius:10px;

    background:#f5f8fc;

    color:#718096;

    font-size:18px;

    transition:.2s;
}

.close-btn:hover{
    background:#eaf3ff;

    color:#176bd8;

    border-color:#bdd6f4;
}


/* =========================================================
   STATUS BUTTONS
========================================================= */

.status-title{
    color:#6e7e91;

    font-size:12px;

    margin-bottom:9px;

    font-weight:bold;
}

.status-buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-bottom:18px;
}

.status-btn{
    border:1px solid #dce7f3;

    background:#f9fbfd;

    color:#526276;

    padding:12px 8px;

    border-radius:12px;

    font-size:12px;

    font-weight:bold;

    transition:
        background .2s,
        color .2s,
        border-color .2s,
        transform .2s;
}

.status-btn:hover{
    background:#edf5ff;

    color:#176bd8;

    border-color:#b9d5f5;

    transform:translateY(-1px);
}

.status-btn.active{
    border-color:#4d96f5;

    background:
        linear-gradient(
            135deg,
            #eaf4ff,
            #dceeff
        );

    color:#0965d5;

    box-shadow:
        inset 0 0 0 1px rgba(22,119,255,.05),
        0 4px 12px rgba(22,119,255,.08);
}


/* =========================================================
   MODAL PHONES
========================================================= */

.modal-phones{
    display:grid;
    gap:8px;
}

.modal-phone{
    text-decoration:none;

    color:#176bd8;

    background:#f9fbfd;

    border:1px solid #dce7f3;

    border-radius:12px;

    padding:13px;

    text-align:center;

    direction:ltr;

    font-weight:bold;

    transition:.2s;
}

.modal-phone:hover{
    background:#edf6ff;

    border-color:#9fc5f3;

    color:#075fca;

    transform:translateY(-1px);
}

.modal-note{
    margin-top:15px;

    color:#66778b;

    background:#f7f9fc;

    border:1px solid #e5edf5;

    padding:12px;

    border-radius:12px;

    font-size:12px;

    line-height:1.8;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    text-align:center;

    padding:50px 20px;

    color:#8291a3;

    background:#ffffff;

    border:1px dashed #d9e5f1;

    border-radius:16px;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:flex;

    gap:7px;

    flex-wrap:wrap;

    margin-bottom:17px;
}

.stat{
    background:#ffffff;

    border:1px solid #dfe9f3;

    border-radius:10px;

    padding:7px 10px;

    color:#718096;

    font-size:11px;

    box-shadow:
        0 3px 10px rgba(35,75,120,.04);
}

.stat strong{
    color:#176bd8;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#ffffff;

    border:1px solid #dce7f3;

    color:#26364c;

    padding:12px 17px;

    border-radius:12px;

    font-size:12px;

    font-weight:bold;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:200;

    box-shadow:
        0 12px 30px rgba(31,65,105,.16);
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header{
        padding:13px;
    }

    .container{
        padding:
            20px
            12px
            45px;
    }

    .province-grid{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .hospital-grid{
        grid-template-columns:1fr;
    }

    .province-card{
        min-height:95px;
        padding:14px;
    }

    .province-name{
        font-size:14px;
    }

    .province-count{
        font-size:11px;
    }

    .logo{
        font-size:21px;
    }

    .page-title{
        font-size:21px;
    }

    .top-btn{
        width:100%;
        max-width:300px;
    }

    .search-box input{
        height:50px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="logo">
            مدیریت <span>بیمارستان‌ها</span>
        </div>

        <div class="top-actions">
            <button class="top-btn" onclick="exportTXT()">
                💾 خروجی اطلاعات
            </button>
        </div>

    </div>
</header>


<main class="container">

    <div id="provincePage">

        <div class="page-title">
            استان‌ها
        </div>

        <div class="page-subtitle">
            استان موردنظر را انتخاب کنید
        </div>

        <div class="search-box">

            <span class="search-icon">🔍</span>

            <input
                id="provinceSearch"
                type="text"
                placeholder="جستجوی استان..."
                oninput="renderProvinces()"
            >

            <button
                id="provinceClear"
                class="clear-search"
                onclick="clearProvinceSearch()"
            >×</button>

        </div>

        <div id="provinceGrid" class="province-grid"></div>

    </div>


    <div id="hospitalPage" style="display:none">

        <button class="back-btn" onclick="showProvinces()">
            ← بازگشت به استان‌ها
        </button>

        <div class="page-title" id="hospitalPageTitle"></div>

        <div class="search-box">

            <span class="search-icon">🔍</span>

            <input
                id="hospitalSearch"
                type="text"
                placeholder="جستجوی بیمارستان، شهر، وضعیت یا یادداشت..."
                oninput="renderHospitals(currentProvince)"
            >

            <button
                id="hospitalClear"
                class="clear-search"
                onclick="clearHospitalSearch()"
            >×</button>

        </div>

        <div id="hospitalStats" class="stats"></div>

        <div id="hospitalGrid" class="hospital-grid"></div>

    </div>

</main>


<div
    id="modal"
    class="modal"
    onclick="closeModalByBackdrop(event)"
>

    <div class="modal-box">

        <div class="modal-header">

            <div>

                <div
                    id="modalTitle"
                    class="modal-title"
                ></div>

                <div
                    id="modalCity"
                    class="modal-city"
                ></div>

            </div>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div class="status-title">
            وضعیت بیمارستان
        </div>

        <div
            id="statusButtons"
            class="status-buttons"
        ></div>


        <div class="status-title">
            شماره تلفن‌ها
        </div>

        <div
            id="modalPhones"
            class="modal-phones"
        ></div>


        <div
            id="modalNote"
            class="modal-note"
            style="display:none"
        ></div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>


/* =========================================================

/* =========================================================
   تنظیمات ذخیره‌سازی
========================================================= */

const STATUS_KEY = "hospital_status_v4";

const DELETED_KEY = "deleted_hospitals_v1";

let currentProvince = null;

let currentHospital = null;


/* =========================================================
   نرمال‌سازی متن فارسی
========================================================= */

function normalizeText(value){

    return String(value || "")
        .toLowerCase()
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ة/g,"ه")
        .replace(/ۀ/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g," ")
        .replace(/\u200c/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   تبدیل اعداد فارسی به انگلیسی
========================================================= */

function toEnglishDigits(value){

    return String(value || "")
        .replace(/[۰-۹]/g,d =>
            String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        )
        .replace(/[٠-٩]/g,d =>
            String("٠١٢٣٤٥٦٧٨٩".indexOf(d))
        );

}


/* =========================================================
   کلید یکتا برای وضعیت
========================================================= */

function hospitalStatusKey(province,id){

    return normalizeText(province) + "_" + id;

}


/* =========================================================
   وضعیت بیمارستان
========================================================= */

const statusNames = {

    ready:"آماده تماس",

    "no-answer":"تماس بی‌پاسخ",

    catalog:"ارسال کاتالوگ",

    "follow-up":"پیگیری"

};


function getHospitalStatus(province,id){

    const key =
        hospitalStatusKey(province,id);

    return localStorage.getItem(
        STATUS_KEY + "_" + key
    )
    ||
    initialHospitalStatuses[province]?.[id]
    ||
    "no-answer";

}


function setHospitalStatus(province,id,status){

    const key =
        hospitalStatusKey(province,id);

    localStorage.setItem(
        STATUS_KEY + "_" + key,
        status
    );

}


/* =========================================================
   حذف بیمارستان‌ها
========================================================= */

function getDeletedHospitals(){

    try{

        return JSON.parse(
            localStorage.getItem(DELETED_KEY) || "{}"
        );

    }catch(e){

        return {};

    }

}


function isHospitalDeleted(province,id){

    const deleted =
        getDeletedHospitals();

    return !!deleted[
        hospitalStatusKey(province,id)
    ];

}


function getVisibleHospitals(province){

    return (hospitals[province] || [])
        .filter(h =>
            !isHospitalDeleted(
                province,
                h.id
            )
        );

}


/* =========================================================
   حذف بیمارستان
========================================================= */

function deleteHospital(event,province,id){

    event.stopPropagation();

    const hospital =
        (hospitals[province] || [])
        .find(h => h.id === id);

    if(!hospital) return;

    const confirmed =
        confirm(
            `آیا از حذف «${hospital.name}» مطمئن هستید؟\n\n` +
            `این بیمارستان از لیست سایت حذف می‌شود.`
        );

    if(!confirmed) return;

    const deleted =
        getDeletedHospitals();

    deleted[
        hospitalStatusKey(
            province,
            id
        )
    ] = true;

    localStorage.setItem(
        DELETED_KEY,
        JSON.stringify(deleted)
    );

    showToast(
        "بیمارستان حذف شد"
    );

    if(currentProvince === province){

        renderStats(province);

        renderHospitals(province);

    }

}

}

            "provinceSearch"
        );

    const clear =
        document.getElementById(
            "provinceClear"
        );

    const search =
        normalizeText(
            input.value
        );

    clear.classList.toggle(
        "show",
        !!search
    );

    const filtered =
        provinces.filter(
            province =>
                normalizeText(
                    province
                ).includes(search)
        );

    grid.innerHTML = "";

    if(!filtered.length){

        grid.innerHTML = `
            <div class="empty">
                استانی با این نام پیدا نشد.
            </div>
        `;

        return;

    }


    filtered.forEach(province => {

        const list =
            getVisibleHospitals(
                province
            );


        const ready =
            list.filter(
                h =>
                    getHospitalStatus(
                        province,
                        h.id
                    ) === "ready"
            ).length;


        const noAnswer =
            list.filter(
                h =>
                    getHospitalStatus(
                        province,
                        h.id
                    ) === "no-answer"
            ).length;


        const catalog =
            list.filter(
                h =>
                    getHospitalStatus(
                        province,
                        h.id
                    ) === "catalog"
            ).length;


        const followUp =
            list.filter(
                h =>
                    getHospitalStatus(
                        province,
                        h.id
                    ) === "follow-up"
            ).length;


        const card =
            document.createElement(
                "div"
            );

        card.className =
            "province-card";

        card.onclick =
            () => openProvince(
                province
            );


        card.innerHTML = `

            <div class="province-name">
                ${escapeHTML(province)}
            </div>

            <div class="province-count">
                ${list.length} بیمارستان
            </div>

            ${
                list.length
                ?
                `
                <div class="province-status">

                    <span class="mini-status">
                        آماده: ${ready}
                    </span>

                    <span class="mini-status">
                        بی‌پاسخ: ${noAnswer}
                    </span>

                    <span class="mini-status">
                        کاتالوگ: ${catalog}
                    </span>

                    <span class="mini-status">
                        پیگیری: ${followUp}
                    </span>

                </div>
                `
                :
                `
                <div
                    class="province-count"
                    style="margin-top:10px"
                >
                    بدون بیمارستان
                </div>
                `
            }

        `;

        grid.appendChild(card);

    });

}


/* =========================================================
   باز کردن استان
========================================================= */

function openProvince(province){

    currentProvince =
        province;

    document.getElementById(
        "provincePage"
    ).style.display = "none";

    document.getElementById(
        "hospitalPage"
    ).style.display = "block";

    document.getElementById(
        "hospitalPageTitle"
    ).textContent =
        "بیمارستان‌های " + province;

    renderStats(province);

    renderHospitals(province);

}


/* =========================================================
   آمار
========================================================= */

function renderStats(province){

    const list =
        getVisibleHospitals(
            province
        );


    const ready =
        list.filter(
            h =>
                getHospitalStatus(
                    province,
                    h.id
                ) === "ready"
        ).length;


    const noAnswer =
        list.filter(
            h =>
                getHospitalStatus(
                    province,
                    h.id
                ) === "no-answer"
        ).length;


    const catalog =
        list.filter(
            h =>
                getHospitalStatus(
                    province,
                    h.id
                ) === "catalog"
        ).length;


    const followUp =
        list.filter(
            h =>
                getHospitalStatus(
                    province,
                    h.id
                ) === "follow-up"
        ).length;


    document.getElementById(
        "hospitalStats"
    ).innerHTML = `

        <div class="stat">
            کل: <strong>${list.length}</strong>
        </div>

        <div class="stat">
            آماده تماس:
            <strong>${ready}</strong>
        </div>

        <div class="stat">
            بی‌پاسخ:
            <strong>${noAnswer}</strong>
        </div>

        <div class="stat">
            کاتالوگ:
            <strong>${catalog}</strong>
        </div>

        <div class="stat">
            پیگیری:
            <strong>${followUp}</strong>
        </div>

    `;

}


/* =========================================================
   جستجوی بیمارستان
========================================================= */

function hospitalMatches(
    hospital,
    province,
    search
){

    if(!search) return true;

    const tokens =
        normalizeText(search)
        .split(" ")
        .filter(Boolean);


    const status =
        getHospitalStatus(
            province,
            hospital.id
        );


    const statusText =
        statusNames[status] || "";


    const searchable =
        normalizeText([

            hospital.name,

            hospital.city,

            statusText,

            hospital.note || "",

            ...(hospital.phones || [])

        ].join(" "));


    return tokens.every(
        token =>
            searchable.includes(token)
    );

}


/* =========================================================
   نمایش بیمارستان‌ها
========================================================= */

function renderHospitals(province){

    const grid =
        document.getElementById(
            "hospitalGrid"
        );


    const input =
        document.getElementById(
            "hospitalSearch"
        );


    const clear =
        document.getElementById(
            "hospitalClear"
        );


    const search =
        input.value;


    clear.classList.toggle(
        "show",
        !!normalizeText(search)
    );


    const list =
        getVisibleHospitals(
            province
        )
        .filter(
            h =>
                hospitalMatches(
                    h,
                    province,
                    search
                )
        );


    grid.innerHTML = "";


    if(!list.length){

        grid.innerHTML = `
            <div class="empty">
                بیمارستانی با این جستجو پیدا نشد.
            </div>
        `;

        return;

    }


    list.forEach(hospital => {

        const status =
            getHospitalStatus(
                province,
                hospital.id
            );


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "hospital-card";


        card.onclick =
            () =>
                openHospital(
                    province,
                    hospital.id
                );


        const statusClass =

            status === "ready"

            ? "status-ready"

            : status === "catalog"

            ? "status-catalog"

            : status === "follow-up"

            ? "status-follow-up"

            : "status-no-answer";


        const phonesHTML =

            (hospital.phones || [])

            .map(phone => {

                const tel =
                    toEnglishDigits(phone)
                    .replace(/[^\d+]/g,"");


                return `

                    <a
                        class="card-phone"
                        href="tel:${tel}"
                        onclick="event.stopPropagation()"
                    >
                        📞 ${escapeHTML(phone)}
                    </a>

                `;

            })

            .join("");


        card.innerHTML = `

            <div class="hospital-title-row">

                <div class="hospital-name">
                    ${escapeHTML(
                        hospital.name
                    )}
                </div>


                <button
                    class="delete-btn"
                    title="حذف بیمارستان"
                    onclick="
                        deleteHospital(
                            event,
                            '${escapeJS(province)}',
                            ${hospital.id}
                        )
                    "
                >
                    🗑
                </button>

            </div>


            <div class="hospital-city">

                📍 ${escapeHTML(
                    hospital.city
                )}

            </div>


            <div
                class="status-badge ${statusClass}"
            >

                ${
                    statusNames[status]
                }

            </div>


            <div>
                ${phonesHTML}
            </div>


            ${
                hospital.note
                ?
                `
                    <div class="note">
                        📝 ${
                            escapeHTML(
                                hospital.note
                            )
                        }
                    </div>
                `
                :
                ""
            }

        `;


        grid.appendChild(card);

    });

}


/* =========================================================
   باز کردن بیمارستان
========================================================= */

function openHospital(
    province,
    id
){

    const hospital =
        (hospitals[province] || [])
        .find(
            h =>
                h.id === id
        );


    if(!hospital) return;


    if(
        isHospitalDeleted(
            province,
            id
        )
    ) return;


    currentHospital =
        hospital;


    document.getElementById(
        "modalTitle"
    ).textContent =
        hospital.name;


    document.getElementById(
        "modalCity"
    ).textContent =
        "📍 " + hospital.city;


    const status =
        getHospitalStatus(
            province,
            id
        );


    const statusButtons =
        document.getElementById(
            "statusButtons"
        );


    statusButtons.innerHTML = "";


    Object.entries(
        statusNames
    ).forEach(
        ([key,label]) => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "status-btn";


            if(status === key){

                btn.classList.add(
                    "active"
                );

            }


            btn.textContent =
                label;


            btn.onclick = () => {

                setHospitalStatus(
                    province,
                    id,
                    key
                );


                closeModal();


                renderStats(
                    province
                );


                renderHospitals(
                    province
                );


                showToast(
                    "وضعیت به «" +
                    label +
                    "» تغییر کرد"
                );

            };


            statusButtons.appendChild(
                btn
            );

        }
    );


    const phones =
        document.getElementById(
            "modalPhones"
        );


    phones.innerHTML = "";


    (hospital.phones || [])
        .forEach(phone => {

            const tel =
                toEnglishDigits(phone)
                .replace(/[^\d+]/g,"");


            const a =
                document.createElement(
                    "a"
                );


            a.className =
                "modal-phone";


            a.href =
                "tel:" + tel;


            a.textContent =
                "📞 " + phone;


            phones.appendChild(a);

        });


    const note =
        document.getElementById(
            "modalNote"
        );


    if(hospital.note){

        note.style.display =
            "block";

        note.textContent =
            "📝 " +
            hospital.note;

    }else{

        note.style.display =
            "none";

        note.textContent =
            "";

    }


    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   بستن مودال
========================================================= */

function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );

    currentHospital =
        null;

}


function closeModalByBackdrop(
    event
){

    if(
        event.target ===
        event.currentTarget
    ){

        closeModal();

    }

}


document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            closeModal();

        }

    }
);

/* =========================================================
   خروجی TXT
========================================================= */

function exportTXT(){

    let output = "";


    output +=
        "========================================\n";

    output +=
        "گزارش اطلاعات بیمارستان‌ها\n";

    output +=
        "========================================\n\n";


    output +=
        "تاریخ تهیه گزارش: ";


    output +=
        new Date().toLocaleString(
            "fa-IR"
        );


    output +=
        "\n\n";


    let total = 0;


    provinces.forEach(
        province => {

            const list =
                getVisibleHospitals(
                    province
                );


            if(!list.length)
                return;


            output += "\n";

            output +=
                "########################################\n";


            output +=
                "استان: " +
                province +
                "\n";


            output +=
                "تعداد: " +
                list.length +
                "\n";


            output +=
                "########################################\n\n";


            list.forEach(
                (hospital,index) => {

                    total++;


                    const status =
                        getHospitalStatus(
                            province,
                            hospital.id
                        );


                    output +=
                        `${index + 1}. ${hospital.name}\n`;


                    output +=
                        `شهر: ${hospital.city}\n`;


                    output +=
                        `وضعیت: ${statusNames[status]}\n`;


                    output +=
                        "تلفن‌ها:\n";


                    (hospital.phones || [])
                        .forEach(
                            phone => {

                                output +=
                                    "  " +
                                    phone +
                                    "\n";

                            }
                        );


                    if(hospital.note){

                        output +=
                            "یادداشت: " +
                            hospital.note +
                            "\n";

                    }


                    output +=
                        "----------------------------------------\n\n";

                }
            );

        }
    );


    output +=
        "\n========================================\n";


    output +=
        "تعداد کل بیمارستان‌های فعال: " +
        total +
        "\n";


    output +=
        "========================================\n";


    const blob =
        new Blob(
            [
                "\uFEFF" +
                output
            ],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "hospital-data-" +
        new Date()
            .toISOString()
            .slice(0,10) +
        ".txt";


    document.body.appendChild(a);


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "فایل اطلاعات ساخته شد"
    );

}


/* =========================================================
   Toast
========================================================= */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   امنیت نمایش متن
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJS(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}
