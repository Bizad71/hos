
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت بیمارستان‌ها</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --text:#172033;
    --muted:#697386;
    --border:#e5e7eb;

    --ready:#16a34a;
    --no-answer:#dc2626;
    --catalog:#2563eb;
    --follow:#d97706;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
a{
    font-family:inherit;
}

header{
    background:var(--card);
    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1100px;
    margin:auto;

    min-height:70px;
    padding:12px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:var(--primary);
}

.header-title{
    font-size:15px;
    color:var(--muted);
}

main{
    max-width:1100px;
    margin:auto;
    padding:25px 18px 50px;
}

.page-title{
    margin-bottom:7px;
    font-size:25px;
    font-weight:bold;
}

.page-description{
    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;
}


/* =========================
   SEARCH
========================= */

.search-box{
    position:relative;
    margin-bottom:20px;
}

.search-input{
    width:100%;

    border:1px solid var(--border);
    background:#fff;

    border-radius:14px;

    padding:14px 48px 14px 45px;

    font-size:14px;

    color:var(--text);

    outline:none;

    transition:.2s;
}

.search-input:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
}

.search-input::placeholder{
    color:#9ca3af;
}

.search-icon{
    position:absolute;

    right:16px;
    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    pointer-events:none;
}

.clear-search{
    position:absolute;

    left:10px;
    top:50%;

    transform:translateY(-50%);

    width:30px;
    height:30px;

    border:none;
    border-radius:50%;

    background:#f1f5f9;

    color:var(--muted);

    cursor:pointer;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:19px;
}

.clear-search.show{
    display:flex;
}

.search-result-count{
    margin-top:-8px;
    margin-bottom:14px;

    font-size:12px;
    color:var(--muted);
}

.search-hint{
    margin-top:-8px;
    margin-bottom:17px;

    font-size:12px;
    color:var(--muted);
}


/* =========================
   PROVINCES
========================= */

.province-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.province-card{
    border:1px solid var(--border);
    background:var(--card);

    border-radius:16px;
    padding:20px;

    cursor:pointer;
    transition:.2s;

    min-height:90px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.province-card:hover{
    border-color:var(--primary);

    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.06);
}

.province-name{
    font-size:17px;
    font-weight:bold;
}

.province-count{
    font-size:12px;
    color:var(--muted);
    margin-top:7px;
}

.arrow{
    width:34px;
    height:34px;

    border-radius:50%;

    background:#eff6ff;
    color:var(--primary);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}


/* =========================
   BACK
========================= */

.back-button{
    border:none;
    background:transparent;

    color:var(--primary);

    font-size:15px;

    cursor:pointer;

    margin-bottom:20px;

    padding:5px 0;
}


/* =========================
   HOSPITAL
========================= */

.hospital-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.hospital-card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:16px;

    padding:18px;

    cursor:pointer;

    transition:.2s;
}

.hospital-card:hover{
    border-color:var(--primary);

    box-shadow:
        0 7px 22px rgba(0,0,0,.06);
}

.hospital-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.hospital-name{
    font-size:16px;

    font-weight:bold;

    line-height:1.8;
}

.hospital-city{
    color:var(--muted);

    font-size:13px;

    margin-top:5px;
}


/* =========================
   STATUS
========================= */

.status{
    white-space:nowrap;

    padding:7px 11px;

    border-radius:30px;

    font-size:12px;

    font-weight:bold;
}

.status-ready{
    background:#dcfce7;
    color:var(--ready);
}

.status-no-answer{
    background:#fee2e2;
    color:var(--no-answer);
}

.status-catalog{
    background:#dbeafe;
    color:var(--catalog);
}

.status-follow{
    background:#fef3c7;
    color:var(--follow);
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(15,23,42,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;

    z-index:1000;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:550px;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:22px;

    padding:23px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.2);
}

.modal-header{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;
}

.modal-title{
    font-size:20px;

    font-weight:bold;

    line-height:1.8;
}

.close-button{
    width:36px;
    height:36px;

    border:none;

    border-radius:50%;

    background:#f1f5f9;

    cursor:pointer;

    font-size:20px;

    flex-shrink:0;
}

.section-title{
    font-size:14px;

    font-weight:bold;

    margin-bottom:10px;
}

.phone-list{
    display:flex;

    flex-direction:column;

    gap:9px;

    margin-bottom:25px;
}

.phone-button{
    text-decoration:none;

    background:#eff6ff;

    border:1px solid #dbeafe;

    color:var(--primary);

    border-radius:12px;

    padding:13px 15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    direction:ltr;

    font-size:15px;

    font-weight:bold;

    transition:.2s;
}

.phone-button:hover{
    background:#dbeafe;
}

.phone-icon{
    direction:rtl;
}


/* =========================
   INFO
========================= */

.modal-info{
    background:#f8fafc;

    border:1px solid var(--border);

    border-radius:13px;

    padding:12px;

    margin-bottom:20px;

    font-size:12px;

    color:var(--muted);

    line-height:2;
}

.modal-info:empty{
    display:none;
}


/* =========================
   STATUS BUTTONS
========================= */

.status-buttons{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:8px;
}

.status-button{
    border:2px solid transparent;

    border-radius:12px;

    padding:13px 7px;

    cursor:pointer;

    font-weight:bold;

    font-size:11px;

    transition:.2s;
}

.status-button.ready{
    background:#dcfce7;
    color:var(--ready);
}

.status-button.no-answer{
    background:#fee2e2;
    color:var(--no-answer);
}

.status-button.catalog{
    background:#dbeafe;
    color:var(--catalog);
}

.status-button.follow{
    background:#fef3c7;
    color:var(--follow);
}

.status-button.selected{
    border-color:currentColor;

    transform:scale(.97);
}


/* =========================
   EMPTY
========================= */

.empty{
    background:white;

    border:1px solid var(--border);

    border-radius:16px;

    padding:30px;

    text-align:center;

    color:var(--muted);

    line-height:2;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header-inner{
        min-height:60px;
    }

    .header-title{
        display:none;
    }

    main{
        padding:20px 14px 40px;
    }

    .page-title{
        font-size:22px;
    }

    .province-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .province-card{
        padding:15px;
        min-height:80px;
        border-radius:14px;
    }

    .province-name{
        font-size:15px;
    }

    .arrow{
        width:29px;
        height:29px;
        font-size:15px;
    }

    .hospital-card{
        padding:15px;
    }

    .hospital-top{
        align-items:flex-start;
    }

    .hospital-name{
        font-size:14px;
    }

    .status{
        font-size:10px;
        padding:6px 8px;
    }

    .status-buttons{
        grid-template-columns:1fr 1fr;
    }

    .status-button{
        padding:14px 5px;
    }

    .modal{
        align-items:flex-end;
        padding:0;
    }

    .modal-box{
        max-width:none;

        max-height:92vh;

        border-radius:22px 22px 0 0;

        padding:20px;
    }

}

@media(max-width:380px){

    .province-grid{
        grid-template-columns:1fr;
    }

    .status-buttons{
        grid-template-columns:1fr;
    }

}


/* =========================
   HOSPITAL NUMBER
========================= */

.hospital-number{
    color:#94a3b8;
    font-size:11px;
    margin-bottom:3px;
}

</style>

/* =========================================================
   MAP HOSPITAL IDS TO PROVINCE
========================================================= */

function getHospitalStorageKey(province,id){

    if(province === "فارس"){

        return "fars_" + id;

    }

    if(province === "اصفهان"){

        return "isfahan_" + (
            id - 100
        );

    }

    return province + "_" + id;

}


/* =========================================================
   GET STATUS
========================================================= */

function getHospitalStatus(
    province,
    hospital
){

    const key =
        "hospital_status_" +
        getHospitalStorageKey(
            province,
            hospital.id
        );


    const saved =
        localStorage.getItem(key);


    if(saved){

        return saved;

    }


    const initialKey =
        getHospitalStorageKey(
            province,
            hospital.id
        );


    return initialHospitalStatuses[
        initialKey
    ] || null;

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(text){

    return String(text || "")

        .toLowerCase()

        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ة/g,"ه")
        .replace(/ۀ/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ|أ|ٱ/g,"ا")

        .replace(/‌/g," ")

        .replace(/\s+/g," ")

        .trim();

}


/* =========================================================
   STATUS SEARCH TEXT
========================================================= */

function getStatusSearchText(status){

    if(status === "ready"){

        return `
            آماده تماس
            اماده تماس
            آماده
            اماده
        `;

    }


    if(status === "no-answer"){

        return `
            تماس بی پاسخ
            تماس بیپاسخ
            بی پاسخ
            بیپاسخ
        `;

    }


    if(status === "catalog"){

        return `
            ارسال کاتالوگ
            کاتالوگ
            کاتالوگ ارسال شد
        `;

    }


    if(status === "follow"){

        return `
            پیگیری
            پی گيری
        `;

    }


    return "وضعیت ثبت نشده";

}


/* =========================================================
   SEARCH MATCH
========================================================= */

function matchesHospitalSearch(
    province,
    hospital,
    query
){

    const normalizedQuery =
        normalizeText(query);


    if(!normalizedQuery){

        return true;

    }


    const status =
        getHospitalStatus(
            province,
            hospital
        );


    const statusText =
        statusNames[status] ||
        "وضعیت ثبت نشده";


    const note =
        hospitalNotes[
            hospital.id
        ] || "";


    const searchableText =
        normalizeText(

            hospital.name +
            " " +
            hospital.city +
            " " +
            statusText +
            " " +
            getStatusSearchText(status) +
            " " +
            note

        );


    const words =
        normalizedQuery
            .split(" ")
            .filter(Boolean);


    return words.every(
        word =>
            searchableText.includes(word)
    );

}

                        <div class="hospital-number">
                            ردیف ${number}
                        </div>

                        <div class="hospital-name">
                            ${hospital.name}
                        </div>

                        <div class="hospital-city">
                            ${hospital.city}
                        </div>

                    </div>


                    <div
                        class="status ${getStatusClass(currentStatus)}">

                        ${
                            statusNames[currentStatus]
                            || "وضعیت ثبت نشده"
                        }

                    </div>

                </div>

            `;


            list.appendChild(card);

        }
    );

}


/* =========================================================
   SHOW PROVINCES
========================================================= */

function showProvinces(){

    document
        .getElementById(
            "hospitalsPage"
        )
        .style.display = "none";


    document
        .getElementById(
            "provincesPage"
        )
        .style.display = "block";


    currentProvince = null;


    const hospitalSearch =
        document.getElementById(
            "hospitalSearch"
        );


    hospitalSearch.value = "";


    updateClearButton(
        hospitalSearch,

        document.getElementById(
            "clearHospitalSearch"
        )
    );


    renderProvinces();

}


/* =========================================================
   OPEN HOSPITAL
========================================================= */

function openHospital(
    province,
    hospital
){

    selectedHospital =
        hospital;


    document
        .getElementById(
            "modalHospitalName"
        )
        .textContent =
            hospital.name;


    document
        .getElementById(
            "modalHospitalCity"
        )
        .textContent =
            hospital.city;


    const phones =
        document.getElementById(
            "modalPhones"
        );


    phones.innerHTML = "";


    hospital.phones.forEach(
        phone => {

            const button =
                document.createElement("a");


            button.className =
                "phone-button";


            /*
                برای شماره‌هایی مثل:
                03152653131-7
                یا مقادیر دارای خط تیره
                فقط خود شماره را دستکاری نمی‌کنیم.
            */

            button.href =
                "tel:" +
                phone
                    .replace(/[^\d+]/g,"");


            button.innerHTML = `

                <span>
                    ${phone}
                </span>

                <span class="phone-icon">
                    📞 تماس
                </span>

            `;


            phones.appendChild(button);

        }
    );


    const info =
        document.getElementById(
            "modalInfo"
        );


    info.textContent =
        hospitalNotes[
            hospital.id
        ] || "";


    updateStatusButtons(
        province,
        hospital
    );


    document
        .getElementById(
            "hospitalModal"
        )
        .classList.add("active");

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document
        .getElementById(
            "hospitalModal"
        )
        .classList.remove("active");


    selectedHospital = null;

}


/* =========================================================
   SET STATUS
========================================================= */

function setHospitalStatus(status){

    if(!selectedHospital){

        return;

    }


    const key =
        "hospital_status_" +

        getHospitalStorageKey(
            currentProvince,
            selectedHospital.id
        );


    localStorage.setItem(
        key,
        status
    );


    updateStatusButtons(
        currentProvince,
        selectedHospital
    );


    closeModal();


    /*
       جستجوی فعلی حفظ می‌شود.
    */

    if(currentProvince){

        renderHospitals(
            currentProvince
        );

    }

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(status){

    if(status === "ready"){

        return "status-ready";

    }


    if(status === "no-answer"){

        return "status-no-answer";

    }


    if(status === "catalog"){

        return "status-catalog";

    }


    if(status === "follow"){

        return "status-follow";

    }


    return "";

}


/* =========================================================
   UPDATE STATUS BUTTONS
========================================================= */

function updateStatusButtons(
    province,
    hospital
){

    if(!hospital){

        return;

    }


    const current =
        getHospitalStatus(
            province,
            hospital
        );


    document
        .getElementById(
            "statusReady"
        )
        .classList.toggle(
            "selected",
            current === "ready"
        );


    document
        .getElementById(
            "statusNoAnswer"
        )
        .classList.toggle(
            "selected",
            current === "no-answer"
        );


    document
        .getElementById(
            "statusCatalog"
        )
        .classList.toggle(
            "selected",
            current === "catalog"
        );


    document
        .getElementById(
            "statusFollow"
        )
        .classList.toggle(
            "selected",
            current === "follow"
        );

}


/* =========================================================
   CLEAR BUTTON
========================================================= */

function updateClearButton(
    input,
    button
){

    if(input.value.trim()){

        button.classList.add("show");

    }else{

        button.classList.remove("show");

    }

}


/* =========================================================
   PROVINCE SEARCH
========================================================= */

const provinceSearch =
    document.getElementById(
        "provinceSearch"
    );


const clearProvinceSearch =
    document.getElementById(
        "clearProvinceSearch"
    );


provinceSearch.addEventListener(
    "input",
    function(){

        updateClearButton(
            provinceSearch,
            clearProvinceSearch
        );


        renderProvinces();

    }
);


clearProvinceSearch.addEventListener(
    "click",
    function(){

        provinceSearch.value = "";


        updateClearButton(
            provinceSearch,
            clearProvinceSearch
        );


        renderProvinces();


        provinceSearch.focus();

    }
);


/* =========================================================
   HOSPITAL SEARCH
========================================================= */

const hospitalSearch =
    document.getElementById(
        "hospitalSearch"
    );


const clearHospitalSearch =
    document.getElementById(
        "clearHospitalSearch"
    );


hospitalSearch.addEventListener(
    "input",
    function(){

        updateClearButton(
            hospitalSearch,
            clearHospitalSearch
        );


        if(currentProvince){

            renderHospitals(
                currentProvince
            );

        }

    }
);


clearHospitalSearch.addEventListener(
    "click",
    function(){

        hospitalSearch.value = "";


        updateClearButton(
            hospitalSearch,
            clearHospitalSearch
        );


        if(currentProvince){

            renderHospitals(
                currentProvince
            );

        }


        hospitalSearch.focus();

    }
);


/* =========================================================
   MODAL BACKDROP
========================================================= */

document
    .getElementById(
        "hospitalModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeModal();

            }

        }
    );


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeModal();

        }

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

renderProvinces();

</script>

</body>

</html>
