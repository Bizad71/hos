<head>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #172033;
            --muted: #697386;
            --border: #e5e7eb;

            --ready: #16a34a;
            --no-answer: #dc2626;
            --catalog: #2563eb;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        a {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            min-height: 70px;
            padding: 12px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }

        .header-title {
            font-size: 15px;
            color: var(--muted);
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1100px;
            margin: auto;
            padding: 25px 18px 50px;
        }

        .page-title {
            margin-bottom: 7px;
            font-size: 25px;
            font-weight: bold;
        }

        .page-description {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* =========================
           PROVINCES
        ========================= */

        .province-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .province-card {
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 16px;
            padding: 20px;

            cursor: pointer;
            transition: .2s;

            min-height: 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .province-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, .06);
        }

        .province-name {
            font-size: 17px;
            font-weight: bold;
        }

        .province-count {
            font-size: 12px;
            color: var(--muted);
            margin-top: 7px;
        }

        .arrow {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #eff6ff;
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            border: none;
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
            padding: 5px 0;
        }

        /* =========================
           HOSPITAL LIST
        ========================= */

        .hospital-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hospital-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;

            cursor: pointer;
            transition: .2s;
        }

        .hospital-card:hover {
            border-color: var(--primary);
            box-shadow: 0 7px 22px rgba(0, 0, 0, .06);
        }

        .hospital-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .hospital-name {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.8;
        }

        .hospital-city {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        /* =========================
           STATUS BADGE
        ========================= */

        .status {
            white-space: nowrap;
            padding: 7px 11px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-ready {
            background: #dcfce7;
            color: var(--ready);
        }

        .status-no-answer {
            background: #fee2e2;
            color: var(--no-answer);
        }

        .status-catalog {
            background: #dbeafe;
            color: var(--catalog);
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(15, 23, 42, .55);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 18px;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;

            background: white;
            border-radius: 22px;
            padding: 23px;

            box-shadow: 0 25px 70px rgba(0,0,0,.2);
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
        }

        .close-button {
            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background: #f1f5f9;
            cursor: pointer;

            font-size: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* =========================
           PHONE BUTTONS
        ========================= */

        .phone-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 25px;
        }

        .phone-button {
            text-decoration: none;

            background: #eff6ff;
            border: 1px solid #dbeafe;

            color: var(--primary);

            border-radius: 12px;
            padding: 13px 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            direction: ltr;

            font-size: 15px;
            font-weight: bold;

            transition: .2s;
        }

        .phone-button:hover {
            background: #dbeafe;
        }

        .phone-icon {
            direction: rtl;
        }

        /* =========================
           STATUS BUTTONS
        ========================= */

        .status-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
        }

        .status-button {
            border: 2px solid transparent;
            border-radius: 12px;

            padding: 13px 8px;

            cursor: pointer;
            font-weight: bold;
            font-size: 12px;

            transition: .2s;
        }

        .status-button.ready {
            background: #dcfce7;
            color: var(--ready);
        }

        .status-button.no-answer {
            background: #fee2e2;
            color: var(--no-answer);
        }

        .status-button.catalog {
            background: #dbeafe;
            color: var(--catalog);
        }

        .status-button.selected {
            border-color: currentColor;
            transform: scale(.97);
        }

        /* =========================
           EMPTY / INFO
        ========================= */

        .empty {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

           MOBILE
        ========================= */

                font-size: 22px;

            .province-name {
                font-size: 15px;
            }

            .arrow {

                font-size: 15px;
            }

            .hospital-card {

                grid-template-columns: 1fr;
            }

    /* =========================================================
       وضعیت‌ها
    ========================================================= */

    const statusNames = {
        "ready": "آماده تماس",
        "no-answer": "تماس بی‌پاسخ",
        "catalog": "ارسال کاتالوگ"
    };


    let selectedHospital = null;


    /* =========================================================
       نمایش استان‌ها
    ========================================================= */

    function renderProvinces() {

        const grid = document.getElementById("provinceGrid");

        grid.innerHTML = "";

        provinces.forEach(province => {

            const count = hospitals[province]
                ? hospitals[province].length
                : 0;

            const card = document.createElement("div");

            card.className = "province-card";

            card.onclick = () => openProvince(province);

            card.innerHTML = `
                <div>
                    <div class="province-name">${province}</div>
                    <div class="province-count">
                        ${count > 0 ? count + " بیمارستان" : "اطلاعات هنوز وارد نشده"}
                    </div>
                </div>

                <div class="arrow">
                    ←
                </div>
            `;

            grid.appendChild(card);
        });
    }


    /* =========================================================
       باز کردن استان
    ========================================================= */

    function openProvince(province) {

        document.getElementById("provincesPage").style.display = "none";
        document.getElementById("hospitalsPage").style.display = "block";

        document.getElementById("provinceTitle").textContent =
            province;

        const list = document.getElementById("hospitalList");

        list.innerHTML = "";

        const provinceHospitals = hospitals[province] || [];

        document.getElementById("provinceDescription").textContent =
            provinceHospitals.length
                ? `${provinceHospitals.length} بیمارستان ثبت شده`
                : "هنوز اطلاعات بیمارستان‌های این استان وارد نشده است.";


        if (provinceHospitals.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    اطلاعات بیمارستان‌های این استان
                    هنوز اضافه نشده است.
                </div>
            `;

            return;
        }


        provinceHospitals.forEach(hospital => {

            const card = document.createElement("div");

            card.className = "hospital-card";

            const currentStatus =
                getHospitalStatus(hospital.id);

            card.onclick = () => openHospital(hospital);

            card.innerHTML = `
                <div class="hospital-top">

                    <div>
                        <div class="hospital-name">
                            ${hospital.name}
                        </div>

                        <div class="hospital-city">
                            ${hospital.city}
                        </div>
                    </div>

                    <div class="status ${getStatusClass(currentStatus)}">
                        ${statusNames[currentStatus] || "وضعیت ثبت نشده"}
                    </div>

                </div>
            `;

            list.appendChild(card);
        });
    }


    /* =========================================================
       بازگشت
    ========================================================= */

    function showProvinces() {

        document.getElementById("hospitalsPage").style.display = "none";
        document.getElementById("provincesPage").style.display = "block";
    }


    /* =========================================================
       باز کردن بیمارستان
    ========================================================= */

    function openHospital(hospital) {

        selectedHospital = hospital;

        document.getElementById("modalHospitalName").textContent =
            hospital.name;

        document.getElementById("modalHospitalCity").textContent =
            hospital.city;


        const phones = document.getElementById("modalPhones");

        phones.innerHTML = "";


        hospital.phones.forEach(phone => {

            const button = document.createElement("a");

            button.className = "phone-button";

            button.href = "tel:" + phone;

            button.innerHTML = `
                <span>${phone}</span>
                <span class="phone-icon">📞 تماس</span>
            `;

            phones.appendChild(button);
        });


        updateStatusButtons();

        document.getElementById("hospitalModal")
            .classList.add("active");
    }


    /* =========================================================
       بستن Modal
    ========================================================= */

    function closeModal() {

        document.getElementById("hospitalModal")
            .classList.remove("active");

        selectedHospital = null;
    }


    /* =========================================================
       تغییر وضعیت بیمارستان
    ========================================================= */

    function setHospitalStatus(status) {

        if (!selectedHospital) {
            return;
        }

        const key =
            "hospital_status_" + selectedHospital.id;

        localStorage.setItem(key, status);

        updateStatusButtons();

        /*
           لیست پشت Modal هم به‌روزرسانی شود
        */
        openProvince(
            findProvinceByHospital(selectedHospital.id)
        );

        closeModal();
    }


    /* =========================================================
       وضعیت ذخیره شده
    ========================================================= */

    function getHospitalStatus(id) {

        return localStorage.getItem(
            "hospital_status_" + id
        );
    }


    /* =========================================================
       کلاس وضعیت
    ========================================================= */

    function getStatusClass(status) {

        if (status === "ready") {
            return "status-ready";
        }

        if (status === "no-answer") {
            return "status-no-answer";
        }

        if (status === "catalog") {
            return "status-catalog";
        }

        return "";
    }


    /* =========================================================
       آپدیت دکمه‌های وضعیت
    ========================================================= */

    function updateStatusButtons() {

        if (!selectedHospital) {
            return;
        }

        const current =
            getHospitalStatus(selectedHospital.id);

        document
            .getElementById("statusReady")
            .classList.toggle(
                "selected",
                current === "ready"
            );

        document
            .getElementById("statusNoAnswer")
            .classList.toggle(
                "selected",
                current === "no-answer"
            );

        document
            .getElementById("statusCatalog")
            .classList.toggle(
                "selected",
                current === "catalog"
            );
    }


    /* =========================================================
       پیدا کردن استان بیمارستان
    ========================================================= */

    function findProvinceByHospital(id) {

        for (const province of Object.keys(hospitals)) {

            const found =
                hospitals[province]
                    .find(hospital => hospital.id === id);

            if (found) {
                return province;
            }
        }

        return null;
    }


    /* =========================================================
       کلیک بیرون Modal
    ========================================================= */

    document
        .getElementById("hospitalModal")
        .addEventListener("click", function(event) {

            if (event.target === this) {
                closeModal();
            }

        });


    /* =========================================================
       شروع سایت
    ========================================================= */

    renderProvinces();

</script>
