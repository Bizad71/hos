<!DOCTYPE html>
<html lang="fa" dir="rtl">

<title>مدیریت بیمارستان‌ها</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#2196f3;
    --blue-dark:#1477c9;
    --blue-light:#eef7ff;
    --blue-border:#cfe6f8;

    --bg:#f5f9fc;
    --white:#ffffff;

    --text:#17202a;
    --text-soft:#64748b;

    --border:#e1e9ef;
    --border-light:#e9eff3;

    --danger:#dc5555;
}


/* =========================================================
   BODY
   ========================================================= */

body{
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    background:#fff;
    padding:20px;
    text-align:center;
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 12px rgba(30,90,130,.05);
}

.header h1{
    margin-bottom:15px;
    font-size:24px;
    color:var(--text);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.top-btn,
.back-btn{
    border:1px solid var(--blue-border);
    padding:11px 17px;
    border-radius:10px;
    cursor:pointer;
    background:var(--blue-light);
    color:var(--blue-dark);
    font-family:inherit;
    font-size:13px;
    transition:.18s;
}

.top-btn:hover,
.back-btn:hover{
    background:#dff0ff;
    border-color:#b9dcf5;
}

.back-btn{
    margin-bottom:5px;
}


/* =========================================================
   CONTAINER
   ========================================================= */

.container{
    width:min(1200px,94%);
    margin:25px auto;
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-box{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.search-box input{
    flex:1;
    padding:13px 15px;
    border-radius:11px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    outline:none;
    font-family:inherit;
    font-size:14px;
    transition:.18s;
}

.search-box input::placeholder{
    color:#9aa8b5;
}

.search-box input:focus{
    border-color:#8bc8f5;
    box-shadow:0 0 0 3px rgba(33,150,243,.08);
}

.search-clear{
    display:none;
    padding:10px 14px;
    cursor:pointer;
    border:1px solid var(--border);
    background:#fff;
    color:#718096;
    border-radius:10px;
    font-family:inherit;
}

.search-clear.show{
    display:block;
}


/* =========================================================
   GRID
   ========================================================= */

.grid{
    display:grid;
    grid-template-columns:repeat(
        auto-fill,
        minmax(250px,1fr)
    );
    gap:14px;
}


/* =========================================================
   CARDS
   ========================================================= */

.province-card,
.hospital-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:17px;
    cursor:pointer;
    transition:
        transform .18s,
        box-shadow .18s,
        border-color .18s;
}

.province-card:hover,
.hospital-card:hover{
    transform:translateY(-2px);
    border-color:#c9dfef;
    box-shadow:0 7px 22px rgba(31,94,130,.07);
}

.province-name,
.hospital-name{
    font-weight:bold;
    font-size:16px;
    color:var(--text);
}

.province-count,
.hospital-city{
    color:var(--text-soft);
    margin-top:8px;
    font-size:13px;
}

.province-status{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:12px;
}

.mini-status{
    font-size:11px;
    padding:5px 8px;
    background:#f3f7fa;
    color:#637587;
    border:1px solid #e5edf2;
    border-radius:7px;
}


/* =========================================================
   HOSPITAL TITLE
   ========================================================= */

.hospital-title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.delete-btn{
    border:1px solid #f0d5d5;
    background:#fff7f7;
    color:var(--danger);
    border-radius:8px;
    padding:6px 8px;
    cursor:pointer;
    transition:.18s;
}

.delete-btn:hover{
    background:#ffeded;
}


/* =========================================================
   HOSPITAL STATUS
   ========================================================= */

.status-badge{
    display:inline-block;
    margin:12px 0;
    padding:6px 9px;
    border-radius:7px;
    font-size:11px;
    background:#eef7ff;
    color:var(--blue-dark);
    border:1px solid #d5ebfb;
}

.status-ready,
.status-no-answer,
.status-catalog,
.status-follow-up,
.status-emed{
    background:#eef7ff;
    color:var(--blue-dark);
    border-color:#d5ebfb;
}


/* =========================================================
   PHONE BUTTONS
   ========================================================= */

.card-phone,
.modal-phone{
    display:block;
    text-decoration:none;
    color:var(--blue-dark);
    background:#f7fbfe;
    border:1px solid #dcecf7;
    padding:10px 12px;
    margin-top:7px;
    border-radius:9px;
    transition:.18s;
    direction:ltr;
    text-align:left;
    font-size:14px;
}

.card-phone:hover,
.modal-phone:hover{
    background:#eaf6ff;
    border-color:#bcdff5;
}


/* =========================================================
   NOTE
   ========================================================= */

.note{
    margin-top:12px;
    padding:10px 12px;
    background:#f7f9fb;
    border:1px solid var(--border-light);
    border-radius:9px;
    color:var(--text-soft);
    font-size:12px;
    line-height:1.8;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    text-align:center;
    padding:40px;
    color:#8997a5;
    grid-column:1/-1;
}


/* =========================================================
   STATS
   ========================================================= */

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:15px 0;
}

.stat{
    background:#fff;
    border:1px solid var(--border);
    color:var(--text-soft);
    padding:9px 12px;
    border-radius:9px;
    font-size:12px;
}

.stat strong{
    color:var(--blue-dark);
    margin-right:3px;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(30,55,75,.28);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border:1px solid #dce7ee;
    border-radius:17px;
    padding:20px;
    box-shadow:0 20px 55px rgba(30,80,110,.16);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.modal-header h2{
    color:var(--text);
    font-size:19px;
}

.close-btn{
    border:1px solid var(--border);
    background:#f7fafc;
    color:#718096;
    border-radius:9px;
    width:38px;
    height:38px;
    cursor:pointer;
    font-size:14px;
}

.close-btn:hover{
    background:#edf6fc;
    color:var(--blue-dark);
}

.modal-box h3{
    font-size:14px;
    color:#263746;
    margin-top:18px;
    margin-bottom:9px;
}


/* =========================================================
   STATUS BUTTONS
   ========================================================= */

.status-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:8px;
}

.status-btn{
    flex:1;
    min-width:105px;
    padding:10px 11px;
    border:1px solid #dce6ed;
    background:#f8fafc;
    color:#667788;
    border-radius:9px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    transition:.18s;
}

.status-btn:hover{
    background:#eef7fd;
    border-color:#bddcf1;
    color:#2586c9;
}

.status-btn.active{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
    box-shadow:0 3px 10px rgba(33,150,243,.18);
}


/* =========================================================
   MODAL NOTE
   ========================================================= */

#modalNote{
    margin-top:15px;
    padding:11px 12px;
    background:#f7f9fb;
    border:1px solid #e6edf2;
    border-radius:9px;
    line-height:1.8;
    color:var(--text-soft);
    font-size:12px;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#fff;
    color:var(--blue-dark);
    border:1px solid #cfe5f4;
    padding:11px 17px;
    border-radius:10px;
    box-shadow:0 8px 25px rgba(30,80,110,.12);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}


/* =========================================================
   LOADING
   ========================================================= */

.loading{
    text-align:center;
    padding:50px;
    color:#8292a0;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    .header{
        padding:17px 14px;
    }

    .header h1{
        font-size:20px;
    }

    .container{
        width:94%;
        margin:18px auto;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .province-card,
    .hospital-card{
        padding:15px;
    }

    .modal{
        padding:10px;
    }

    .modal-box{
        max-height:94vh;
        padding:16px;
        border-radius:15px;
    }

    .status-buttons{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:7px;
    }

    .status-btn{
        min-width:0;
        padding:11px 6px;
    }

    .stats{
        gap:5px;
    }

    .stat{
        flex:1;
        min-width:90px;
        text-align:center;
    }

}

<header class="header">

    <h1>مدیریت بیمارستان‌ها</h1>

    <button
        class="top-btn"
        onclick="exportTXT()"
    >
        💾 خروجی اطلاعات
    </button>

</header>


<main class="container">


    <!-- =====================================================
         صفحه استان‌ها
         ===================================================== -->

    <div id="provincePage">

        <div class="search-box">

            <input
                id="provinceSearch"
                type="text"
                placeholder="جستجوی استان..."
                oninput="renderProvinces()"
            >

            <button
                id="provinceClear"
                class="search-clear"
                onclick="clearProvinceSearch()"
            >
                ✕
            </button>

        </div>


        <div
            id="provinceGrid"
            class="grid"
        >

            <div class="loading">
                در حال دریافت اطلاعات...
            </div>

        </div>

    </div>



    <!-- =====================================================
         صفحه بیمارستان‌ها
         ===================================================== -->

    <div
        id="hospitalPage"
        style="display:none"
    >

        <button
            class="back-btn"
            onclick="showProvinces()"
        >
            ← بازگشت به استان‌ها
        </button>


        <h2
            id="hospitalPageTitle"
            style="margin-top:20px"
        ></h2>


        <div
            id="hospitalStats"
            class="stats"
        ></div>


        <div class="search-box">

            <input
                id="hospitalSearch"
                type="text"
                placeholder="جستجوی بیمارستان، شهر، تلفن یا وضعیت..."
                oninput="renderHospitals(currentProvince)"
            >

            <button
                id="hospitalClear"
                class="search-clear"
                onclick="clearHospitalSearch()"
            >
                ✕
            </button>

        </div>


        <div
            id="hospitalGrid"
            class="grid"
        ></div>

    </div>

</main>



<!-- =========================================================
     MODAL
     ========================================================= -->

<div
    id="modal"
    class="modal"
    onclick="closeModalByBackdrop(event)"
>

    <div class="modal-box">


        <div class="modal-header">

            <div>

                <h2 id="modalTitle"></h2>

                <div
                    id="modalCity"
                    style="color:#64748b;margin-top:8px"
                ></div>

            </div>


            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>



        <!-- =================================================
             شماره تلفن‌ها

            شماره تلفن‌ها
        </h3>

        <div id="modalPhones"></div>

        <h3>

        </h3>

        <div

            class="status-buttons"
        ></div>



        <div id="modalNote"></div>

    </div>

</div>



<div
    id="toast"

></div>

   دریافت فایل hospitals.json
   ========================================================= */

async function loadHospitals(){

    try{

        const response =
            await fetch(
                "./data/hospitals.json",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const text =
            await response.text();


        if(!text.trim()){

            throw new Error(
                "فایل hospitals.json خالی است"
            );

        }


        let data;


        try{

            data =
                JSON.parse(text);

        }
        catch(error){

            data =
                Function(
                    '"use strict"; return (' +
                    text +
                    ');'
                )();

        }


        hospitals =
            data;


        renderProvinces();

    }
    catch(error){

        console.error(error);


        document.getElementById(
            "provinceGrid"
        ).innerHTML = `

            <div class="empty">

                ❌ خطا در دریافت اطلاعات

                <br><br>

                فایل
                <b>data/hospitals.json</b>
                را بررسی کنید.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

    }

}



/* =========================================================
   نرمال‌سازی متن
   ========================================================= */

function normalizeText(value){

    return String(value || "")
        .toLowerCase()
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ة/g,"ه")
        .replace(/ۀ/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g," ")
        .replace(/\u200c/g," ")
        .replace(/\s+/g," ")
        .trim();

}


function toEnglishDigits(value){

    return String(value || "")
        .replace(
            /[۰-۹]/g,
            d =>
                String(
                    "۰۱۲۳۴۵۶۷۸۹".indexOf(d)
                )
        )
        .replace(
            /[٠-٩]/g,
            d =>
                String(
                    "٠١٢٣٤٥٦٧٨٩".indexOf(d)
                )
        );

}



/* =========================================================
   کلید بیمارستان
   ========================================================= */

function hospitalStatusKey(
    province,
    id
){

    return normalizeText(
        province
    ) + "_" + id;

}



/* =========================================================
   وضعیت بیمارستان
   ========================================================= */

function getHospitalStatus(
    province,
    id
){

    const key =
        hospitalStatusKey(
            province,
            id
        );


    return localStorage.getItem(
        STATUS_KEY + "_" + key
    )
    ||
    initialHospitalStatuses[
        province
    ]?.[id]
    ||
    "no-answer";

}


function setHospitalStatus(
    province,
    id,
    status
){

    localStorage.setItem(
        STATUS_KEY + "_" +
        hospitalStatusKey(
            province,
            id
        ),
        status
    );

}



/* =========================================================
   بیمارستان‌های حذف‌شده
   ========================================================= */

function getDeletedHospitals(){

    try{

        return JSON.parse(
            localStorage.getItem(
                DELETED_KEY
            ) || "{}"
        );

    }
    catch(error){

        return {};

    }

}


function isHospitalDeleted(
    province,
    id
){

    const deleted =
        getDeletedHospitals();


    return !!deleted[
        hospitalStatusKey(
            province,
            id
        )
    ];

}



/* =========================================================
   فقط بیمارستان‌های فعال
   ========================================================= */

function getVisibleHospitals(
    province
){

    return (
        hospitals[province] || []
    )
    .filter(
        hospital =>
            !isHospitalDeleted(
                province,
                hospital.id
            )
    );

}



/* =========================================================
   نمایش استان‌ها
   ========================================================= */

function renderProvinces(){

    const grid =
        document.getElementById(
            "provinceGrid"
        );


    const input =
        document.getElementById(
            "provinceSearch"
        );


    const clear =
        document.getElementById(
            "provinceClear"
        );


    const search =
        normalizeText(
            input.value
        );


    clear.classList.toggle(
        "show",
        !!search
    );


    const filtered =
        provinces.filter(
            province =>
                normalizeText(
                    province
                ).includes(search)
        );


    grid.innerHTML =
        "";


    if(!filtered.length){

        grid.innerHTML = `
            <div class="empty">
                استانی با این نام پیدا نشد.
            </div>
        `;

        return;

    }


    filtered.forEach(
        province => {

            const list =
                getVisibleHospitals(
                    province
                );


            const countStatus =
                status =>

                    list.filter(
                        hospital =>
                            getHospitalStatus(
                                province,
                                hospital.id
                            ) === status
                    ).length;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "province-card";


            card.onclick =
                () =>
                    openProvince(
                        province
                    );


            card.innerHTML = `

                <div class="province-name">
                    ${escapeHTML(province)}
                </div>

                <div class="province-count">
                    ${list.length} بیمارستان
                </div>

                ${
                    list.length
                    ?
                    `
                    <div class="province-status">

                        <span class="mini-status">
                            آماده: ${countStatus("ready")}
                        </span>

                        <span class="mini-status">
                            بی‌پاسخ: ${countStatus("no-answer")}
                        </span>

                        <span class="mini-status">
                            کاتالوگ: ${countStatus("catalog")}
                        </span>

                        <span class="mini-status">
                            پیگیری: ${countStatus("follow-up")}
                        </span>

                        ${
                            countStatus("emed")
                            ?
                            `
                            <span class="mini-status">
                                eMed: ${countStatus("emed")}
                            </span>
                            `
                            :
                            ""
                        }

                    </div>
                    `
                    :
                    `
                    <div
                        class="province-count"
                        style="margin-top:10px"
                    >
                        بدون بیمارستان
                    </div>
                    `
                }

            `;


            grid.appendChild(
                card
            );

        }
    );

}



/* =========================================================
   باز کردن استان
   ========================================================= */

function openProvince(
    province
){

    currentProvince =
        province;


    document.getElementById(
        "provincePage"
    ).style.display =
        "none";


    document.getElementById(
        "hospitalPage"
    ).style.display =
        "block";


    document.getElementById(
        "hospitalPageTitle"
    ).textContent =
        "بیمارستان‌های " +
        province;


    document.getElementById(
        "hospitalSearch"
    ).value =
        "";


    renderStats(
        province
    );


    renderHospitals(
        province
    );

}



/* =========================================================
   آمار
   ========================================================= */

function renderStats(
    province
){

    const list =
        getVisibleHospitals(
            province
        );


    const count =
        status =>

            list.filter(
                hospital =>
                    getHospitalStatus(
                        province,
                        hospital.id
                    ) === status
            ).length;


    document.getElementById(
        "hospitalStats"
    ).innerHTML = `

        <div class="stat">
            کل:
            <strong>${list.length}</strong>
        </div>

        <div class="stat">
            آماده تماس:
            <strong>${count("ready")}</strong>
        </div>

        <div class="stat">
            بی‌پاسخ:
            <strong>${count("no-answer")}</strong>
        </div>

        <div class="stat">
            کاتالوگ:
            <strong>${count("catalog")}</strong>
        </div>

        <div class="stat">
            پیگیری:
            <strong>${count("follow-up")}</strong>
        </div>

        <div class="stat">
            eMed:
            <strong>${count("emed")}</strong>
        </div>

    `;

}



/* =========================================================
   جستجو
   ========================================================= */

function hospitalMatches(
    hospital,
    province,
    search
){

    if(!search)
        return true;


    const tokens =
        normalizeText(
            search
        )
        .split(" ")
        .filter(Boolean);


    const status =
        getHospitalStatus(
            province,
            hospital.id
        );


    const searchable =
        normalizeText([

            hospital.name,
            hospital.city,
            statusNames[status] || "",
            hospital.note || "",
            ...(hospital.phones || [])

        ].join(" "));


    return tokens.every(
        token =>
            searchable.includes(token)
    );

}



/* =========================================================
   نمایش بیمارستان‌ها
   ========================================================= */

function renderHospitals(
    province
){

    const grid =
        document.getElementById(
            "hospitalGrid"
        );


    const input =
        document.getElementById(
            "hospitalSearch"
        );


    const clear =
        document.getElementById(
            "hospitalClear"
        );


    const search =
        input.value;


    clear.classList.toggle(
        "show",
        !!normalizeText(search)
    );


    const list =
        getVisibleHospitals(
            province
        )
        .filter(
            hospital =>
                hospitalMatches(
                    hospital,
                    province,
                    search
                )
        );


    grid.innerHTML =
        "";


    if(!list.length){

        grid.innerHTML = `
            <div class="empty">
                بیمارستانی با این جستجو پیدا نشد.
            </div>
        `;

        return;

    }


    list.forEach(
        hospital => {

            const status =
                getHospitalStatus(
                    province,
                    hospital.id
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "hospital-card";


            card.onclick =
                () =>
                    openHospital(
                        province,
                        hospital.id
                    );


            const phonesHTML =
                (hospital.phones || [])
                .map(
                    phone => `

                        <a
                            class="card-phone"
                            href="tel:${phoneHref(phone)}"
                            onclick="event.stopPropagation()"
                        >
                            📞 ${escapeHTML(phone)}
                        </a>

                    `
                )
                .join("");


            card.innerHTML = `

                <div class="hospital-title-row">

                    <div class="hospital-name">
                        ${escapeHTML(
                            hospital.name
                        )}
                    </div>

                    <button
                        class="delete-btn"
                        title="حذف بیمارستان"
                        onclick="
                            deleteHospital(
                                event,
                                '${escapeJS(province)}',
                                ${hospital.id}
                            )
                        "
                    >
                        🗑
                    </button>

                </div>


                <div class="hospital-city">
                    📍 ${escapeHTML(
                        hospital.city || ""
                    )}
                </div>


                <div
                    class="status-badge ${statusClass(status)}"
                >
                    ${escapeHTML(
                        statusNames[status] ||
                        "تماس بی‌پاسخ"
                    )}
                </div>


                <div>
                    ${phonesHTML}
                </div>


                ${
                    hospital.note
                    ?
                    `
                    <div class="note">
                        📝 ${escapeHTML(
                            hospital.note
                        )}
                    </div>
                    `
                    :
                    ""
                }

            `;


            grid.appendChild(
                card
            );

        }
    );

}



/* =========================================================
   وضعیت کلاس
   ========================================================= */

function statusClass(
    status
){

    if(status === "ready")
        return "status-ready";

    if(status === "catalog")
        return "status-catalog";

    if(status === "follow-up")
        return "status-follow-up";

    if(status === "emed")
        return "status-emed";

    return "status-no-answer";

}



/* =========================================================
   شماره تلفن
   ========================================================= */

function phoneHref(
    phone
){

    return toEnglishDigits(
        phone
    )
    .replace(
        /[^\d+]/g,
        ""
    );

}



/* =========================================================
   باز کردن بیمارستان
   ========================================================= */

function openHospital(
    province,
    id
){

    const hospital =
        (hospitals[province] || [])
        .find(
            h =>
                h.id === id
        );


    if(
        !hospital ||
        isHospitalDeleted(
            province,
            id
        )
    )
        return;


    currentHospital =
        hospital;


    document.getElementById(
        "modalTitle"
    ).textContent =
        hospital.name;


    document.getElementById(
        "modalCity"
    ).textContent =
        "📍 " +
        (hospital.city || "");



    /* =====================================================
       شماره‌ها
       ===================================================== */

    const phones =
        document.getElementById(
            "modalPhones"
        );


    phones.innerHTML =
        "";


    (hospital.phones || [])
    .forEach(
        phone => {

            const a =
                document.createElement(
                    "a"
                );


            a.className =
                "modal-phone";


            a.href =
                "tel:" +
                phoneHref(phone);


            a.textContent =
                "📞 " +
                phone;


            phones.appendChild(
                a
            );

        }
    );



    /* =====================================================
       وضعیت‌ها
       ===================================================== */

    const statusButtons =
        document.getElementById(
            "statusButtons"
        );


    statusButtons.innerHTML =
        "";


    const currentStatus =
        getHospitalStatus(
            province,
            id
        );


    Object.entries(
        statusNames
    )
    .forEach(
        ([key,label]) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "status-btn";


            if(
                currentStatus === key
            ){

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                label;


            button.onclick =
                () => {

                    setHospitalStatus(
                        province,
                        id,
                        key
                    );


                    closeModal();


                    renderStats(
                        province
                    );


                    renderHospitals(
                        province
                    );


                    renderProvinces();


                    showToast(
                        "وضعیت به «" +
                        label +
                        "» تغییر کرد"
                    );

                };


            statusButtons.appendChild(
                button
            );

        }
    );



    /* =====================================================
       یادداشت
       ===================================================== */

    const note =
        document.getElementById(
            "modalNote"
        );


    if(hospital.note){

        note.style.display =
            "block";


        note.textContent =
            "📝 " +
            hospital.note;

    }
    else{

        note.style.display =
            "none";


        note.textContent =
            "";

    }


    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );

}



/* =========================================================
   حذف بیمارستان
   ========================================================= */

function deleteHospital(
    event,
    province,
    id
){

    event.stopPropagation();


    const hospital =
        (hospitals[province] || [])
        .find(
            h =>
                h.id === id
        );


    if(!hospital)
        return;


    if(
        !confirm(
            `آیا از حذف «${hospital.name}» مطمئن هستید؟`
        )
    )
        return;


    const deleted =
        getDeletedHospitals();


    deleted[
        hospitalStatusKey(
            province,
            id
        )
    ] = true;


    localStorage.setItem(
        DELETED_KEY,
        JSON.stringify(
            deleted
        )
    );


    if(
        currentProvince === province
    ){

        renderStats(
            province
        );


        renderHospitals(
            province
        );

    }


    renderProvinces();


    showToast(
        "بیمارستان حذف شد"
    );

}



/* =========================================================
   بازگشت
   ========================================================= */

function showProvinces(){

    currentProvince =
        null;


    currentHospital =
        null;


    document.getElementById(
        "provincePage"
    ).style.display =
        "block";


    document.getElementById(
        "hospitalPage"
    ).style.display =
        "none";


    document.getElementById(
        "hospitalSearch"
    ).value =
        "";


    renderProvinces();

}



/* =========================================================
   Modal
   ========================================================= */

function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );


    currentHospital =
        null;

}


function closeModalByBackdrop(
    event
){

    if(
        event.target ===
        event.currentTarget
    ){

        closeModal();

    }

}


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);



/* =========================================================
   پاک کردن جستجو
   ========================================================= */

function clearProvinceSearch(){

    document.getElementById(
        "provinceSearch"
    ).value =
        "";


    renderProvinces();

}


function clearHospitalSearch(){

    document.getElementById(
        "hospitalSearch"
    ).value =
        "";


    renderHospitals(
        currentProvince
    );

}



/* =========================================================
   خروجی JSON
   ========================================================= */

/*
   نکته مهم:

   getVisibleHospitals()
   فقط مراکزی را برمی‌گرداند که حذف نشده‌اند.

   بنابراین مراکز حذف‌شده اصلاً وارد فایل خروجی نمی‌شوند.
*/

function exportTXT(){

    const exportData = {};


    provinces.forEach(
        province => {

            const list =
                getVisibleHospitals(
                    province
                );


            if(!list.length)
                return;


            exportData[province] =
                list.map(
                    hospital => {

                        const item = {

                            id:
                                hospital.id,

                            name:
                                hospital.name,

                            city:
                                hospital.city,

                            phones:
                                hospital.phones || []

                        };


                        if(
                            hospital.note
                        ){

                            item.note =
                                hospital.note;

                        }


                        return item;

                    }
                );

        }
    );



    /* =====================================================
       تبدیل به JSON
       ===================================================== */

    const json =
        JSON.stringify(
            exportData,
            null,
            4
        );



    /* =====================================================
       ساخت فایل
       ===================================================== */

    const blob =
        new Blob(
            [
                "\uFEFF" +
                json
            ],
            {
                type:
                    "application/json;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "hospitals-export-" +
        new Date()
            .toISOString()
            .slice(0,10) +
        ".json";


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "فایل JSON ساخته شد"
    );

}



/* =========================================================
   Toast
   ========================================================= */

let toastTimer =
    null;


function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}



/* =========================================================
   امنیت HTML
   ========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}



/* =========================================================
   شروع
   ========================================================= */

loadHospitals();

</script>
