<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت بیمارستان‌ها</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f4f8fc;--bg2:#fff;--card:#fff;--card2:#f8fbff;
--blue:#1677ff;--blue2:#3b8cff;--blue-dark:#0d5dcc;--blue-soft:#eaf3ff;
--text:#172033;--muted:#718096;
--green:#16a66a;--green-soft:#eafaf3;
--orange:#ed9418;--orange-soft:#fff6e7;
--red:#e5484d;--red-soft:#fff0f1;
--border:#e3ebf5;--purple:#7c3aed;--purple-soft:#f2ebff;
}
html{scroll-behavior:smooth}
body{
font-family:Tahoma,Arial,sans-serif;
background:radial-gradient(circle at 50% -15%,rgba(22,119,255,.13),transparent 38%),linear-gradient(180deg,#fff 0%,#f6f9fd 48%,#f1f6fb 100%);
color:var(--text);min-height:100vh
}
button,input{font-family:inherit}
button{cursor:pointer}
.header{
position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);
backdrop-filter:blur(18px);border-bottom:1px solid rgba(220,230,242,.85);
padding:15px;box-shadow:0 5px 25px rgba(31,71,120,.06)
}
.header-inner{max-width:1100px;margin:auto}
.logo{text-align:center;font-size:24px;font-weight:900;color:#172033;margin-bottom:14px}
.logo span{color:var(--blue)}
.top-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.top-btn{
border:1px solid #0d6ff0;background:linear-gradient(135deg,#1680ff,#1267e8);
color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:bold;
box-shadow:0 6px 16px rgba(22,119,255,.20);transition:.2s
}
.top-btn:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(22,119,255,.25)}
.container{max-width:1100px;margin:auto;padding:24px 14px 55px}
.page-title{font-size:23px;font-weight:900;color:#172033;margin-bottom:16px}
.page-subtitle{color:var(--muted);font-size:13px;margin-top:-8px;margin-bottom:18px}
.search-box{position:relative;margin-bottom:18px}
.search-box input{
width:100%;height:52px;background:#fff;border:1px solid #dce7f3;border-radius:15px;
outline:none;color:#172033;padding:0 46px 0 44px;font-size:14px;
box-shadow:0 5px 20px rgba(35,75,120,.055);transition:.2s
}
.search-box input::placeholder{color:#9aa8b8}
.search-box input:focus{border-color:#78afff;box-shadow:0 0 0 4px rgba(22,119,255,.09),0 7px 24px rgba(35,75,120,.07)}
.search-icon{position:absolute;right:15px;top:15px;color:#7d8da1;font-size:17px;pointer-events:none}
.clear-search{
position:absolute;left:10px;top:10px;width:32px;height:32px;border:1px solid #dce7f3;
border-radius:10px;background:#f5f8fc;color:#7d8da1;display:none
}
.clear-search:hover{background:#eaf3ff;color:var(--blue)}
.clear-search.show{display:block}
.province-grid{
display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px
}
.province-card{
position:relative;background:linear-gradient(145deg,#fff,#fafdff);border:1px solid #e1eaf4;
border-radius:18px;padding:18px;min-height:110px;transition:.2s;
box-shadow:0 8px 28px rgba(35,75,120,.075);overflow:hidden
}
.province-card::before{
content:"";position:absolute;top:0;right:0;left:0;height:3px;
background:linear-gradient(90deg,#126be8,#5ba3ff)
}
.province-card:hover{transform:translateY(-3px);border-color:#bcd7f8;box-shadow:0 13px 32px rgba(35,75,120,.12)}
.province-name{font-size:17px;font-weight:900;color:#172033;margin-bottom:10px}
.province-count{color:#718096;font-size:12px}
.province-status{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.mini-status{font-size:10px;padding:4px 7px;border-radius:7px;background:#f2f6fa;color:#6e7e91;border:1px solid #e5edf5}
.back-btn{
border:1px solid #cfe0f4;background:#fff;color:#176bd8;padding:9px 14px;
border-radius:11px;margin-bottom:15px;font-size:12px;font-weight:bold;box-shadow:0 4px 14px rgba(35,75,120,.06)
}
.back-btn:hover{background:#edf5ff;border-color:#a9caf2}
.hospital-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.hospital-card{
position:relative;background:#fff;border:1px solid #e1eaf4;border-radius:18px;padding:17px;
transition:.2s;box-shadow:0 8px 26px rgba(35,75,120,.065)
}
.hospital-card:hover{transform:translateY(-2px);border-color:#bcd7f8;box-shadow:0 13px 32px rgba(35,75,120,.11)}
.hospital-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:7px}
.hospital-name{font-weight:900;line-height:1.7;font-size:15px;color:#172033;flex:1}
.delete-btn{
flex:0 0 auto;width:35px;height:35px;border-radius:10px;border:1px solid #f0c8ca;
background:#fff6f6;color:#e5484d;font-size:16px;transition:.2s
}
.delete-btn:hover{background:#ffe9ea;border-color:#eba7aa}
.hospital-city{color:#8090a3;font-size:12px;margin-bottom:12px}
.status-badge{
display:inline-flex;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:bold;
margin-bottom:12px;border:1px solid transparent
}
.status-ready{color:#128257;background:var(--green-soft);border-color:#c9efdf}
.status-no-answer{color:#d13c42;background:var(--red-soft);border-color:#f7d1d3}
.status-catalog{color:#c27a08;background:var(--orange-soft);border-color:#f5dfb8}
.status-follow-up{color:#146dd4;background:var(--blue-soft);border-color:#c9def9}
.status-emed{color:#6d28d9;background:var(--purple-soft);border-color:#ddd0ff}
.card-phone{
width:100%;border:1px solid #dce7f3;background:linear-gradient(180deg,#fff,#f8fbfe);
color:#176bd8;border-radius:11px;padding:10px;margin-top:7px;text-align:center;
font-size:13px;font-weight:bold;display:block;text-decoration:none;transition:.2s
}
.card-phone:hover{border-color:#9fc5f3;background:#edf6ff;color:#075fca;transform:translateY(-1px)}
.note{margin-top:11px;padding:10px;border-radius:11px;background:#f7f9fc;border:1px solid #e7edf4;color:#68788c;font-size:11px;line-height:1.8}
.modal{
position:fixed;inset:0;background:rgba(22,42,70,.32);backdrop-filter:blur(8px);
display:none;align-items:center;justify-content:center;padding:15px;z-index:100
}
.modal.show{display:flex}
.modal-box{
width:min(520px,100%);max-height:90vh;overflow:auto;
background:linear-gradient(145deg,#fff,#f9fcff);border:1px solid #dce7f3;
border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(31,65,105,.22)
}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:900;line-height:1.7;color:#172033}
.modal-city{color:#7c8da1;font-size:12px;margin-top:4px}
.close-btn{
width:36px;height:36px;border:1px solid #dce7f3;border-radius:10px;
background:#f5f8fc;color:#718096;font-size:18px
}
.status-title{color:#6e7e91;font-size:12px;margin-bottom:9px;font-weight:bold}
.status-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.status-btn{
border:1px solid #dce7f3;background:#f9fbfd;color:#526276;padding:12px 8px;
border-radius:12px;font-size:12px;font-weight:bold;transition:.2s
}
.status-btn:hover{background:#edf5ff;color:#176bd8;border-color:#b9d5f5}
.status-btn.active{border-color:#4d96f5;background:linear-gradient(135deg,#eaf4ff,#dceeff);color:#0965d5}
.modal-phones{display:grid;gap:8px}
.modal-phone{
text-decoration:none;color:#176bd8;background:#f9fbfd;border:1px solid #dce7f3;
border-radius:12px;padding:13px;text-align:center;direction:ltr;font-weight:bold
}
.modal-note{margin-top:15px;color:#66778b;background:#f7f9fc;border:1px solid #e5edf5;padding:12px;border-radius:12px;font-size:12px;line-height:1.8}
.empty{text-align:center;padding:50px 20px;color:#8291a3;background:#fff;border:1px dashed #d9e5f1;border-radius:16px}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}
.stat{background:#fff;border:1px solid #dfe9f3;border-radius:10px;padding:7px 10px;color:#718096;font-size:11px}
.stat strong{color:#176bd8}
.toast{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
background:#fff;border:1px solid #dce7f3;color:#26364c;padding:12px 17px;border-radius:12px;
font-size:12px;font-weight:bold;opacity:0;pointer-events:none;transition:.25s;z-index:200;
box-shadow:0 12px 30px rgba(31,65,105,.16)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){
.header{padding:13px}.container{padding:20px 12px 45px}
.province-grid{grid-template-columns:1fr 1fr;gap:10px}
.hospital-grid{grid-template-columns:1fr}.province-card{min-height:95px;padding:14px}
.province-name{font-size:14px}.province-count{font-size:11px}.logo{font-size:21px}
.page-title{font-size:21px}.top-btn{width:100%;max-width:300px}
}
</style>
</head>

<div id="provinceGrid" class="province-grid"></div>

</div>

<div id="hospitalStats" class="stats"></div>
<div id="hospitalGrid" class="hospital-grid"></div>
</div>

</main>

<div id="modal" class="modal" onclick="closeModalByBackdrop(event)">

<div>

</div>

<div id="toast" class="toast"></div>

const STATUS_KEY="hospital_status_v4";
const DELETED_KEY="deleted_hospitals_v1";

let currentProvince=null;
let currentHospital=null;

const statusNames={
ready:"آماده تماس",
"no-answer":"تماس بی‌پاسخ",
catalog:"ارسال کاتالوگ",
"follow-up":"پیگیری",
emed:"eMed"
};

function normalizeText(value){
return String(value||"").toLowerCase()
.replace(/ي/g,"ی").replace(/ى/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه")
.replace(/ۀ/g,"ه").replace(/ؤ/g,"و").replace(/إ/g,"ا").replace(/أ/g,"ا")
.replace(/ٱ/g,"ا").replace(/‌/g," ").replace(/\u200c/g," ")
.replace(/\s+/g," ").trim();
}

function toEnglishDigits(value){
return String(value||"")
.replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
.replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
}

function hospitalStatusKey(province,id){
return normalizeText(province)+"_"+id;
}

function getHospitalStatus(province,id){
const key=hospitalStatusKey(province,id);
return localStorage.getItem(STATUS_KEY+"_"+key)
||initialHospitalStatuses[province]?.[id]
||"no-answer";
}

function setHospitalStatus(province,id,status){
localStorage.setItem(STATUS_KEY+"_"+hospitalStatusKey(province,id),status);
}

function getDeletedHospitals(){
try{return JSON.parse(localStorage.getItem(DELETED_KEY)||"{}")}
catch(e){return {}}
}

function isHospitalDeleted(province,id){
return !!getDeletedHospitals()[hospitalStatusKey(province,id)];
}

function getVisibleHospitals(province){
return (hospitals[province]||[]).filter(h=>!isHospitalDeleted(province,h.id));
}

function deleteHospital(event,province,id){
event.stopPropagation();
const hospital=(hospitals[province]||[]).find(h=>h.id===id);
if(!hospital)return;

if(!confirm(`آیا از حذف «${hospital.name}» مطمئن هستید؟\n\nاین بیمارستان از لیست سایت حذف می‌شود.`))return;

const deleted=getDeletedHospitals();
deleted[hospitalStatusKey(province,id)]=true;
localStorage.setItem(DELETED_KEY,JSON.stringify(deleted));

showToast("بیمارستان حذف شد");

if(currentProvince===province){
renderStats(province);
renderHospitals(province);
}
}

function hospitalMatches(hospital,province,search){

if(!search)return true;

const tokens=normalizeText(search).split(" ").filter(Boolean);
const status=getHospitalStatus(province,hospital.id);
const searchable=normalizeText([
hospital.name,hospital.city,statusNames[status]||"",hospital.note||"",
...(hospital.phones||[])
].join(" "));

return tokens.every(token=>searchable.includes(token));
}

function phoneHref(phone){
const digits=toEnglishDigits(phone).replace(/[^\d+]/g,"");
return digits;
}

function statusClass(status){
if(status==="ready")return"status-ready";
if(status==="catalog")return"status-catalog";
if(status==="follow-up")return"status-follow-up";
if(status==="emed")return"status-emed";
return"status-no-answer";
}

function renderHospitals(province){

const grid=document.getElementById("hospitalGrid");
const input=document.getElementById("hospitalSearch");
const clear=document.getElementById("hospitalClear");
const search=input.value;

clear.classList.toggle("show",!!normalizeText(search));

const list=getVisibleHospitals(province)
.filter(h=>hospitalMatches(h,province,search));

grid.innerHTML="";

if(!list.length){
grid.innerHTML=`<div class="empty">بیمارستانی با این جستجو پیدا نشد.</div>`;
return;
}

list.forEach(hospital=>{

const status=getHospitalStatus(province,hospital.id);

const card=document.createElement("div");
card.className="hospital-card";
card.onclick=()=>openHospital(province,hospital.id);

const phonesHTML=(hospital.phones||[]).map(phone=>`
<a class="card-phone"
href="tel:${phoneHref(phone)}"
onclick="event.stopPropagation()">
📞 ${escapeHTML(phone)}
</a>
`).join("");

card.innerHTML=`
<div class="hospital-title-row">
<div class="hospital-name">${escapeHTML(hospital.name)}</div>
<button class="delete-btn"
title="حذف بیمارستان"
onclick="deleteHospital(event,'${escapeJS(province)}',${hospital.id})">🗑</button>
</div>

<div class="hospital-city">📍 ${escapeHTML(hospital.city||"")}</div>

<div class="status-badge ${statusClass(status)}">
${escapeHTML(statusNames[status]||"تماس بی‌پاسخ")}
</div>

<div>${phonesHTML}</div>

${hospital.note?`<div class="note">📝 ${escapeHTML(hospital.note)}</div>`:""}
`;

grid.appendChild(card);
});
}

function openHospital(province,id){

const hospital=(hospitals[province]||[]).find(h=>h.id===id);
if(!hospital||isHospitalDeleted(province,id))return;

currentHospital=hospital;

document.getElementById("modalTitle").textContent=hospital.name;
document.getElementById("modalCity").textContent="📍 "+(hospital.city||"");

const currentStatus=getHospitalStatus(province,id);
const statusButtons=document.getElementById("statusButtons");

statusButtons.innerHTML="";

Object.entries(statusNames).forEach(([key,label])=>{

const btn=document.createElement("button");
btn.className="status-btn";

if(currentStatus===key)btn.classList.add("active");

btn.textContent=label;

btn.onclick=()=>{

setHospitalStatus(province,id,key);
closeModal();
renderStats(province);
renderHospitals(province);
showToast("وضعیت به «"+label+"» تغییر کرد");

};

statusButtons.appendChild(btn);
});

const phones=document.getElementById("modalPhones");
phones.innerHTML="";

(hospital.phones||[]).forEach(phone=>{

const a=document.createElement("a");

a.className="modal-phone";
a.href="tel:"+phoneHref(phone);
a.textContent="📞 "+phone;

phones.appendChild(a);
});

const note=document.getElementById("modalNote");

if(hospital.note){
note.style.display="block";
note.textContent="📝 "+hospital.note;
}else{
note.style.display="none";
note.textContent="";
}

document.getElementById("modal").classList.add("show");
}

document.addEventListener("keydown",event=>{

});

let toastTimer=null;

function showToast(message){

const toast=document.getElementById("toast");

toast.textContent=message;
toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=setTimeout(()=>{
toast.classList.remove("show");
},2500);
}

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function escapeJS(value){
return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");
}
