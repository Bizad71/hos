
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت بیمارستان‌ها</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050506;
    --bg2:#0b0b0e;
    --card:rgba(20,20,24,.72);
    --card2:rgba(30,30,35,.82);
    --red:#e50914;
    --red2:#ff3340;
    --red-soft:rgba(229,9,20,.14);
    --text:#fff;
    --muted:#aaa;
    --green:#21d07a;
    --orange:#ff9f43;
    --blue:#4da6ff;
    --border:rgba(255,255,255,.09);
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(229,9,20,.20),transparent 35%),
        linear-gradient(180deg,#050506,#0a0a0d 60%,#050506);
    color:var(--text);
    min-height:100vh;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(5,5,6,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    padding:15px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:900;
    color:#fff;
    margin-bottom:14px;
}

.logo span{
    color:var(--red2);
}

.top-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
}

.top-btn{
    border:1px solid rgba(229,9,20,.35);
    background:rgba(229,9,20,.10);
    color:#fff;
    border-radius:12px;
    padding:10px 14px;
    font-size:13px;
    font-weight:bold;
}

.top-btn:hover{
    background:rgba(229,9,20,.22);
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px 14px 50px;
}

.page-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:16px;
}

.page-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:-8px;
    margin-bottom:18px;
}

.search-box{
    position:relative;
    margin-bottom:18px;
}

.search-box input{
    width:100%;
    height:50px;
    background:rgba(255,255,255,.055);
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    color:#fff;
    padding:0 45px 0 42px;
    font-size:14px;
}

.search-box input:focus{
    border-color:rgba(229,9,20,.55);
    box-shadow:0 0 0 3px rgba(229,9,20,.08);
}

.search-icon{
    position:absolute;
    right:15px;
    top:14px;
    color:#888;
}

.clear-search{
    position:absolute;
    left:10px;
    top:9px;
    width:32px;
    height:32px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.07);
    color:#aaa;
    display:none;
}

.clear-search.show{
    display:block;
}

.province-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:12px;
}

.province-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    min-height:110px;
    transition:.2s;
    box-shadow:0 10px 30px rgba(0,0,0,.20);
}

.province-card:hover{
    transform:translateY(-2px);
    border-color:rgba(229,9,20,.35);
}

.province-name{
    font-size:17px;
    font-weight:900;
    margin-bottom:10px;
}

.province-count{
    color:#aaa;
    font-size:12px;
}

.province-status{
    display:flex;
    gap:5px;
    margin-top:12px;
    flex-wrap:wrap;
}

.mini-status{
    font-size:10px;
    padding:4px 7px;
    border-radius:7px;
    background:rgba(255,255,255,.06);
    color:#bbb;
}

.back-btn{
    border:1px solid var(--border);
    background:rgba(255,255,255,.05);
    color:#fff;
    padding:9px 13px;
    border-radius:11px;
    margin-bottom:15px;
}

.hospital-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:13px;
}

.hospital-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    transition:.2s;
}

.hospital-card:hover{
    border-color:rgba(229,9,20,.35);
}

.hospital-title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:7px;
}

.hospital-name{
    font-weight:900;
    line-height:1.7;
    font-size:15px;
    flex:1;
}

.delete-btn{
    flex:0 0 auto;
    width:35px;
    height:35px;
    border-radius:10px;
    border:1px solid rgba(229,9,20,.30);
    background:rgba(229,9,20,.09);
    color:#ff5963;
    font-size:16px;
}

.delete-btn:hover{
    background:rgba(229,9,20,.25);
    color:#fff;
}

.hospital-city{
    color:#888;
    font-size:12px;
    margin-bottom:12px;
}

.status-badge{
    display:inline-flex;
    padding:6px 9px;
    border-radius:9px;
    font-size:11px;
    font-weight:bold;
    margin-bottom:12px;
}

.status-ready{
    color:#61efa6;
    background:rgba(33,208,122,.11);
}

.status-no-answer{
    color:#ff777e;
    background:rgba(229,9,20,.11);
}

.status-catalog{
    color:#ffbd70;
    background:rgba(255,159,67,.11);
}

.status-follow-up{
    color:#72b7ff;
    background:rgba(77,166,255,.11);
}

.card-phone{
    width:100%;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#fff;
    border-radius:10px;
    padding:9px;
    margin-top:7px;
    text-align:center;
    font-size:13px;
    display:block;
    text-decoration:none;
}

.card-phone:hover{
    border-color:rgba(229,9,20,.4);
    background:rgba(229,9,20,.10);
}

.note{
    margin-top:11px;
    padding:10px;
    border-radius:11px;
    background:rgba(255,255,255,.04);
    color:#bbb;
    font-size:11px;
    line-height:1.8;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111114;
    border:1px solid rgba(255,255,255,.10);
    border-radius:22px;
    padding:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.modal-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
}

.modal-title{
    font-size:18px;
    font-weight:900;
    line-height:1.7;
}

.modal-city{
    color:#888;
    font-size:12px;
    margin-top:4px;
}

.close-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.06);
    color:#aaa;
    font-size:18px;
}

.status-title{
    color:#999;
    font-size:12px;
    margin-bottom:9px;
}

.status-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:18px;
}

.status-btn{
    border:1px solid var(--border);
    background:rgba(255,255,255,.045);
    color:#fff;
    padding:12px 8px;
    border-radius:12px;
    font-size:12px;
    font-weight:bold;
}

.status-btn.active{
    border-color:var(--red);
    background:var(--red-soft);
}

.modal-phones{
    display:grid;
    gap:8px;
}

.modal-phone{
    text-decoration:none;
    color:#fff;
    background:rgba(255,255,255,.055);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px;
    text-align:center;
    direction:ltr;
}

.modal-phone:hover{
    background:rgba(229,9,20,.12);
    border-color:rgba(229,9,20,.4);
}

.modal-note{
    margin-top:15px;
    color:#bbb;
    background:rgba(255,255,255,.04);
    padding:12px;
    border-radius:12px;
    font-size:12px;
    line-height:1.8;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.stats{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:17px;
}

.stat{
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    border-radius:10px;
    padding:7px 10px;
    color:#aaa;
    font-size:11px;
}

.stat strong{
    color:#fff;
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#17171b;
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    padding:12px 17px;
    border-radius:12px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:600px){
    .province-grid{
        grid-template-columns:1fr 1fr;
    }

    .hospital-grid{
        grid-template-columns:1fr;
    }

    .province-card{
        min-height:95px;
        padding:14px;
    }

    .province-name{
        font-size:14px;
    }

    .logo{
        font-size:21px;
    }
}
</style>
</head>

<header class="header">

        <div class="logo">
            مدیریت <span>بیمارستان‌ها</span>
        </div>

        <div class="top-actions">
            <button class="top-btn" onclick="exportTXT()">
                💾 خروجی اطلاعات
            </button>
        </div>
    </div>
</header>

<main class="container">

    <div id="provincePage">
        <div class="page-title">استان‌ها</div>
        <div class="page-subtitle">
            استان موردنظر را انتخاب کنید
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
                id="provinceSearch"
                type="text"
                placeholder="جستجوی استان..."
                oninput="renderProvinces()"
            >
            <button
                id="provinceClear"
                class="clear-search"
                onclick="clearProvinceSearch()"
            >×</button>
        </div>

        <div id="provinceGrid" class="province-grid"></div>
    </div>


    <div id="hospitalPage" style="display:none">

        <button class="back-btn" onclick="showProvinces()">
            ← بازگشت به استان‌ها
        </button>

        <div class="page-title" id="hospitalPageTitle"></div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
                id="hospitalSearch"
                type="text"
                placeholder="جستجوی بیمارستان، شهر، وضعیت یا یادداشت..."
                oninput="renderHospitals(currentProvince)"
            >
            <button
                id="hospitalClear"
                class="clear-search"
                onclick="clearHospitalSearch()"
            >×</button>
        </div>

        <div id="hospitalStats" class="stats"></div>

        <div id="hospitalGrid" class="hospital-grid"></div>

    </div>

</main>


<div id="modal" class="modal" onclick="closeModalByBackdrop(event)">
    <div class="modal-box">

        <div class="modal-header">
            <div>
                <div id="modalTitle" class="modal-title"></div>
                <div id="modalCity" class="modal-city"></div>
            </div>

            <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <div class="status-title">
            وضعیت بیمارستان
        </div>

        <div id="statusButtons" class="status-buttons"></div>

        <div class="status-title">
            شماره تلفن‌ها
        </div>

        <div id="modalPhones" class="modal-phones"></div>

        <div id="modalNote" class="modal-note" style="display:none"></div>

    </div>
</div>


<div id="toast" class="toast"></div>

/* =========================================================

const STATUS_KEY = "hospital_status_v4";
const DELETED_KEY = "deleted_hospitals_v1";

let currentProvince = null;
let currentHospital = null;


/* =========================================================
   نرمال‌سازی متن فارسی
========================================================= */

function normalizeText(value){

    return String(value || "")
        .toLowerCase()
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ة/g,"ه")
        .replace(/ۀ/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g," ")
        .replace(/\u200c/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   تبدیل اعداد فارسی به انگلیسی
========================================================= */

function toEnglishDigits(value){

    return String(value || "")
        .replace(/[۰-۹]/g,d =>
            String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        )
        .replace(/[٠-٩]/g,d =>
            String("٠١٢٣٤٥٦٧٨٩".indexOf(d))
        );
}


/* =========================================================
   کلید یکتا برای وضعیت
   چون ID در استان‌های مختلف تکرار می‌شود
========================================================= */

function hospitalStatusKey(province,id){
    return normalizeText(province) + "_" + id;
}


/* =========================================================
   وضعیت بیمارستان
========================================================= */

const statusNames = {
    ready:"آماده تماس",
    "no-answer":"تماس بی‌پاسخ",
    catalog:"ارسال کاتالوگ",
    "follow-up":"پیگیری"
};


function getHospitalStatus(province,id){

    const key = hospitalStatusKey(province,id);

    return localStorage.getItem(STATUS_KEY + "_" + key)
        || initialHospitalStatuses[province]?.[id]
        || "no-answer";
}


function setHospitalStatus(province,id,status){

    const key = hospitalStatusKey(province,id);

    localStorage.setItem(
        STATUS_KEY + "_" + key,
        status
    );
}


/* =========================================================
   حذف بیمارستان‌ها
========================================================= */

function getDeletedHospitals(){

    try{
        return JSON.parse(
            localStorage.getItem(DELETED_KEY) || "{}"
        );
    }catch(e){
        return {};
    }
}


function isHospitalDeleted(province,id){

    const deleted = getDeletedHospitals();

    return !!deleted[
        hospitalStatusKey(province,id)
    ];
}


function getVisibleHospitals(province){

    return (hospitals[province] || [])
        .filter(h => !isHospitalDeleted(province,h.id));
}


/* =========================================================
   حذف بیمارستان
========================================================= */

function deleteHospital(event,province,id){

    event.stopPropagation();

    const hospital = (hospitals[province] || [])
        .find(h => h.id === id);

    if(!hospital) return;

    const confirmed = confirm(
        `آیا از حذف «${hospital.name}» مطمئن هستید؟\n\n` +
        `این بیمارستان از لیست سایت حذف می‌شود.`
    );

    if(!confirmed) return;

    const deleted = getDeletedHospitals();

    deleted[
        hospitalStatusKey(province,id)
    ] = true;

    localStorage.setItem(
        DELETED_KEY,
        JSON.stringify(deleted)
    );

    showToast("بیمارستان حذف شد");

    if(currentProvince === province){
        renderStats(province);
        renderHospitals(province);
    }
}

/* =========================================================
   جستجوی بیمارستان
========================================================= */

function hospitalMatches(hospital,province,search){

    if(!search) return true;

    const tokens = normalizeText(search)
        .split(" ")
        .filter(Boolean);

    const status = getHospitalStatus(province,hospital.id);

    const statusText = statusNames[status] || "";

    const searchable = normalizeText([
        hospital.name,
        hospital.city,
        statusText,
        hospital.note || "",
        ...(hospital.phones || [])
    ].join(" "));

    return tokens.every(token =>
        searchable.includes(token)
    );
}


/* =========================================================
   نمایش بیمارستان‌ها
========================================================= */

function renderHospitals(province){

    const grid = document.getElementById("hospitalGrid");

    const input = document.getElementById("hospitalSearch");
    const clear = document.getElementById("hospitalClear");

    const search = input.value;

    clear.classList.toggle(
        "show",
        !!normalizeText(search)
    );

    const list = getVisibleHospitals(province)
        .filter(h => hospitalMatches(h,province,search));

    grid.innerHTML = "";

    if(!list.length){

        grid.innerHTML = `
            <div class="empty">
                بیمارستانی با این جستجو پیدا نشد.
            </div>
        `;

        return;
    }

    list.forEach(hospital => {

        const status = getHospitalStatus(
            province,
            hospital.id
        );

        const card = document.createElement("div");

        card.className = "hospital-card";

        card.onclick = () =>
            openHospital(province,hospital.id);

        const statusClass =
            status === "ready"
            ? "status-ready"
            : status === "catalog"
            ? "status-catalog"
            : status === "follow-up"
            ? "status-follow-up"
            : "status-no-answer";

        const phonesHTML =
            (hospital.phones || [])
            .map(phone => {

                const tel =
                    toEnglishDigits(phone)
                    .replace(/[^\d+]/g,"");

                return `
                    <a
                        class="card-phone"
                        href="tel:${tel}"
                        onclick="event.stopPropagation()"
                    >
                        📞 ${escapeHTML(phone)}
                    </a>
                `;
            })
            .join("");

        card.innerHTML = `

            <div class="hospital-title-row">

                <div class="hospital-name">
                    ${escapeHTML(hospital.name)}
                </div>

                <button
                    class="delete-btn"
                    title="حذف بیمارستان"
                    onclick="deleteHospital(event,'${escapeJS(province)}',${hospital.id})"
                >
                    🗑
                </button>

            </div>

            <div class="hospital-city">
                📍 ${escapeHTML(hospital.city)}
            </div>

            <div class="status-badge ${statusClass}">
                ${statusNames[status]}
            </div>

            <div>
                ${phonesHTML}
            </div>

            ${
                hospital.note
                ? `
                    <div class="note">
                        📝 ${escapeHTML(hospital.note)}
                    </div>
                `
                : ""
            }

        `;

        grid.appendChild(card);
    });
}


/* =========================================================
   باز کردن بیمارستان
========================================================= */

function openHospital(province,id){

    const hospital = (hospitals[province] || [])
        .find(h => h.id === id);

    if(!hospital) return;

    if(isHospitalDeleted(province,id)) return;

    currentHospital = hospital;

    document.getElementById("modalTitle").textContent =
        hospital.name;

    document.getElementById("modalCity").textContent =
        "📍 " + hospital.city;

    const status =
        getHospitalStatus(province,id);

    const statusButtons =
        document.getElementById("statusButtons");

    statusButtons.innerHTML = "";

    Object.entries(statusNames).forEach(
        ([key,label]) => {

            const btn =
                document.createElement("button");

            btn.className = "status-btn";

            if(status === key){
                btn.classList.add("active");
            }

            btn.textContent = label;

            btn.onclick = () => {

                setHospitalStatus(
                    province,
                    id,
                    key
                );

                closeModal();

                renderStats(province);
                renderHospitals(province);

                showToast(
                    "وضعیت به «" + label + "» تغییر کرد"
                );
            };

            statusButtons.appendChild(btn);
        }
    );


    const phones =
        document.getElementById("modalPhones");

    phones.innerHTML = "";

    (hospital.phones || []).forEach(phone => {

        const tel =
            toEnglishDigits(phone)
            .replace(/[^\d+]/g,"");

        const a =
            document.createElement("a");

        a.className = "modal-phone";
        a.href = "tel:" + tel;
        a.textContent = "📞 " + phone;

        phones.appendChild(a);
    });


    const note =
        document.getElementById("modalNote");

    if(hospital.note){

        note.style.display = "block";
        note.textContent = "📝 " + hospital.note;

    }else{

        note.style.display = "none";
        note.textContent = "";
    }


    document.getElementById("modal")
        .classList.add("show");
}

/* =========================================================
   خروجی TXT
========================================================= */

function exportTXT(){

    let output = "";

    output += "========================================\n";
    output += "گزارش اطلاعات بیمارستان‌ها\n";
    output += "========================================\n\n";

    output += "تاریخ تهیه گزارش: ";
    output += new Date().toLocaleString("fa-IR");
    output += "\n\n";


    let total = 0;

    provinces.forEach(province => {

        const list =
            getVisibleHospitals(province);

        if(!list.length) return;

        output += "\n";
        output += "########################################\n";
        output += "استان: " + province + "\n";
        output += "تعداد: " + list.length + "\n";
        output += "########################################\n\n";


        list.forEach((hospital,index) => {

            total++;

            const status =
                getHospitalStatus(
                    province,
                    hospital.id
                );

            output +=
                `${index + 1}. ${hospital.name}\n`;

            output +=
                `شهر: ${hospital.city}\n`;

            output +=
                `وضعیت: ${statusNames[status]}\n`;

            output += "تلفن‌ها:\n";

            (hospital.phones || [])
                .forEach(phone => {

                    output +=
                        "  " + phone + "\n";
                });


            if(hospital.note){

                output +=
                    "یادداشت: " +
                    hospital.note +
                    "\n";
            }

            output +=
                "----------------------------------------\n\n";
        });
    });


    output += "\n========================================\n";
    output += "تعداد کل بیمارستان‌های فعال: " + total + "\n";
    output += "========================================\n";


    const blob =
        new Blob(
            ["\uFEFF" + output],
            {type:"text/plain;charset=utf-8"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "hospital-data-" +
        new Date()
            .toISOString()
            .slice(0,10) +
        ".txt";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    showToast("فایل اطلاعات ساخته شد");
}


/* =========================================================
   Toast
========================================================= */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },2500);
}


/* =========================================================
   امنیت نمایش متن
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* =========================================================
   وضعیت اولیه را فقط در صورت نیاز نگه می‌داریم
   تغییرات دستی کاربر روی localStorage ذخیره می‌شوند.
========================================================= */

function initializeInitialStatuses(){

    /*
       وضعیت‌های اولیه از initialHospitalStatuses
       مستقیماً خوانده می‌شوند.

       به محض اینکه کاربر وضعیت را تغییر دهد،
